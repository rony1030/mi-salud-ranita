<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="glp1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="114" stroke="#2A2A32" stroke-width="6"/>

  <!-- Subtle grid lines -->
  <circle cx="256" cy="256" r="190" stroke="#1E1E24" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="140" stroke="#1E1E24" stroke-width="2"/>

  <!-- GymMane Central Dumbbell (Hexagonal athletic plates) -->
  <g transform="translate(256 240) rotate(-35) translate(-256 -240)">
    <!-- Central Bar -->
    <rect x="180" y="226" width="152" height="28" rx="8" fill="#F4F4F6"/>
    <rect x="220" y="222" width="72" height="36" rx="6" fill="#A1A1AA" opacity="0.4"/>
    
    <!-- Left Plate Inner -->
    <rect x="156" y="160" width="24" height="160" rx="8" fill="url(#accentGrad)"/>
    <!-- Left Plate Outer -->
    <rect x="126" y="180" width="22" height="120" rx="6" fill="url(#accentGrad)"/>
    <!-- Left Collar -->
    <rect x="180" y="208" width="10" height="64" rx="4" fill="#E4E4E7"/>

    <!-- Right Plate Inner -->
    <rect x="332" y="160" width="24" height="160" rx="8" fill="url(#accentGrad)"/>
    <!-- Right Plate Outer -->
    <rect x="364" y="180" width="22" height="120" rx="6" fill="url(#accentGrad)"/>
    <!-- Right Collar -->
    <rect x="322" y="208" width="10" height="64" rx="4" fill="#E4E4E7"/>
  </g>

  <!-- Clinical GLP-1 Pulse & Shield Badge below -->
  <g transform="translate(0, 40)">
    <!-- Emerald Shield Glow -->
    <path d="M256 295 L310 325 C310 380 256 415 256 415 C256 415 202 380 202 325 Z" fill="url(#glp1Grad)" filter="url(#glow)" opacity="0.35"/>
    <path d="M256 300 L305 328 C305 378 256 408 256 408 C256 408 207 378 207 328 Z" fill="url(#glp1Grad)"/>
    
    <!-- ECG / Vital Pulse Line -->
    <path d="M224 350 L240 350 L248 332 L256 368 L264 340 L272 350 L288 350" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Corner accent badge -->
  <circle cx="390" cy="120" r="14" fill="#FF6B35" />
  <circle cx="415" cy="145" r="8" fill="#10B981" />
</svg>
