<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0D0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GymMane GLP-1 · Fuerza y Salud Metabólica (Mounjaro / Ozempic)</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <style>
    html, body, #root { min-height: 100%; width: 100%; margin: 0; padding: 0; background-color: #0D0D0F; }
    /* ==========================================================================
   GymMane GLP-1 — Dark Mode Professional Design System
   Inspired by InlitX/GymMane + Clinical Health Tracking
   ========================================================================== */

:root {
  --bg-primary: #0D0D0F;
  --bg-surface: #16161A;
  --bg-elevated: #1E1E24;
  --border-subtle: #2A2A32;
  --border-active: #3E3E4A;
  
  --accent-primary: #FF6B35;
  --accent-secondary: #FF8C42;
  --accent-glp1: #10B981;
  --accent-hydration: #38BDF8;
  
  --status-green: #22C55E;
  --status-yellow: #F59E0B;
  --status-red: #EF4444;

  --text-primary: #F4F4F6;
  --text-secondary: #9CA3AF;
  --text-muted: #6B7280;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--bg-primary);
  min-height: 100dvh;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  outline: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.18s ease;
}

button:active {
  transform: scale(0.97);
}

input, select, textarea {
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.18s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--accent-primary);
}

/* Number tabular alignment */
.tabular-nums, .big-num, .rest-timer-countdown, .live-timer-digits, .metric-large {
  font-variant-numeric: tabular-nums;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--border-active);
}

/* App Viewport Container */
.app-viewport {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  max-width: 860px;
  margin: 0 auto;
  position: relative;
  background-color: var(--bg-primary);
  padding-bottom: 90px; /* Space for fixed bottom nav */
}

/* App Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: rgba(13, 13, 15, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.header-logo-badge {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #2A1A14 0%, #1A1412 100%);
  border: 1px solid rgba(255, 107, 53, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.header-title {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.1;
}

.header-subtitle-tag {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent-glp1);
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot-glp1 {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent-glp1);
  box-shadow: 0 0 8px var(--accent-glp1);
}

.header-right-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-user-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  cursor: pointer;
}

.user-avatar-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}

.user-info-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.user-name {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-primary);
}

.user-weight {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.header-icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.header-icon-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-active);
}

/* Main Content Section */
.app-main-content {
  flex: 1;
  padding: 18px 20px;
}

.tab-section {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.tab-fade-in {
  animation: fadeIn 0.22s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Treatment Hero Card (Hoy Tab) */
.treatment-hero-card {
  background: linear-gradient(145deg, #16161A 0%, #111114 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.treatment-badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.clinical-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: var(--accent-glp1);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 700;
}

.dose-pill {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
}

.goal-pill {
  background: rgba(255, 107, 53, 0.12);
  border: 1px solid rgba(255, 107, 53, 0.3);
  color: var(--accent-primary);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
}

.hero-status-message {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.status-title {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.015em;
  color: var(--text-primary);
}

.status-caption {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.45;
}

/* 7-Day Cycle Bar */
.cycle-bar-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cycle-bar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
}

.cycle-label {
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--accent-glp1);
}

.cycle-phase-name {
  color: var(--text-secondary);
  font-weight: 500;
}

.cycle-track {
  display: flex;
  gap: 6px;
  height: 8px;
}

.cycle-segment {
  flex: 1;
  background: var(--border-subtle);
  border-radius: var(--radius-full);
  transition: all 0.2s ease;
}

.cycle-segment.passed {
  background: #10B981;
  opacity: 0.55;
}

.cycle-segment.current {
  background: #10B981;
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
  transform: scaleY(1.3);
}

.cycle-footer-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.cycle-footer-meta strong {
  color: var(--text-primary);
}

.hero-quick-actions {
  display: flex;
  gap: 12px;
}

.quick-action-btn {
  flex: 1;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.85rem;
}

.quick-action-btn.primary {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: #FFFFFF;
}

.quick-action-btn.secondary {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

/* Dashboard Cards Common */
.dashboard-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title {
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
}

.card-link-btn {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent-primary);
}

/* Macro Rings Grid */
.macro-rings-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.macro-card.hero-protein {
  display: flex;
  align-items: center;
  gap: 18px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.02) 100%);
  border: 1px solid rgba(16, 185, 129, 0.25);
  border-radius: var(--radius-md);
  padding: 16px;
}

.macro-ring-svg-wrap {
  position: relative;
  width: 78px;
  height: 78px;
  flex-shrink: 0;
}

.circular-chart {
  display: block;
  max-width: 100%;
  max-height: 100%;
}

.circle-bg {
  fill: none;
  stroke: var(--border-subtle);
  stroke-width: 3.2;
}

.circle {
  fill: none;
  stroke-width: 3.2;
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s ease;
}

.circular-chart.emerald .circle {
  stroke: var(--accent-glp1);
}

.ring-center-value {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.05;
}

.ring-center-value .big-num {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text-primary);
}

.ring-center-value .unit-sub {
  font-size: 0.65rem;
  color: var(--text-muted);
}

.macro-info-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.macro-badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.macro-name {
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--accent-glp1);
}

.macro-pct-badge {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-glp1);
  font-size: 0.68rem;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: var(--radius-full);
}

.macro-tip {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.macro-mini-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.mini-macro-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mini-macro-val {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
}

.mini-macro-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.mini-progress-bar {
  height: 4px;
  background: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: 2px;
}

.mini-progress-fill.orange {
  background: var(--accent-primary);
  height: 100%;
}
.mini-progress-fill.cyan {
  background: var(--accent-hydration);
  height: 100%;
}
.mini-progress-fill.yellow {
  background: var(--status-yellow);
  height: 100%;
}

/* Hydration */
.hydration-row {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}

.water-glasses-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.water-label-top {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.glasses-icons-list {
  display: flex;
  gap: 6px;
  font-size: 1.1rem;
}

.glass-icon {
  cursor: pointer;
  opacity: 0.25;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.glass-icon.filled {
  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.6));
}

.glass-icon:hover {
  transform: scale(1.15);
}

.hydration-buttons-col {
  display: flex;
  align-items: center;
  gap: 12px;
}

.add-water-btn {
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: var(--accent-hydration);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.8rem;
}

.electrolytes-checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
}

/* Program Preview Card on Today Tab */
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-primary);
  background: rgba(255, 107, 53, 0.1);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.program-preview-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.program-preview-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.prog-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
}

.prog-day-name {
  font-size: 0.82rem;
  color: var(--accent-secondary);
  font-weight: 600;
}

.prog-duration-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.prog-exercises-pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.exercise-pill {
  font-size: 0.72rem;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
}

.exercise-pill.more {
  color: var(--accent-primary);
}

.prog-actions-row {
  display: flex;
  gap: 10px;
}

.start-workout-cta-btn {
  flex: 2;
  background: linear-gradient(135deg, #FF6B35 0%, #E85923 100%);
  color: #FFFFFF;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 4px 14px rgba(255, 107, 53, 0.3);
}

.browse-all-btn {
  flex: 1;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.78rem;
}

/* Symptoms Quick Chips */
.symptom-quick-chips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.symptom-quick-chip {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.symptom-quick-chip span:first-child {
  font-size: 1.3rem;
}

.symptom-quick-chip:hover {
  border-color: var(--accent-glp1);
  color: var(--text-primary);
}

/* Subview Navigation Bar (Inside Tabs) */
.subview-nav-bar {
  display: flex;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 4px;
  gap: 4px;
  overflow-x: auto;
}

.subview-nav-btn {
  flex: 1;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  white-space: nowrap;
}

.subview-nav-btn.active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-active);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

/* Live Workout Session */
.live-header-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}

.live-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 107, 53, 0.15);
  color: var(--accent-primary);
  border: 1px solid rgba(255, 107, 53, 0.3);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.recording-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-primary);
  animation: pulseDot 1.4s infinite;
}

@keyframes pulseDot {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.3); }
  100% { opacity: 1; transform: scale(1); }
}

.live-routine-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
}

.live-day-title {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.live-clock-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 6px 12px;
  border-radius: var(--radius-full);
}

.live-timer-digits {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text-primary);
}

.finish-workout-btn {
  width: 100%;
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: #FFFFFF;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 0.9rem;
}

/* Exercises In Live Session */
.live-exercises-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.live-exercise-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.live-ex-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.live-ex-art-thumb {
  width: 74px;
  height: 74px;
  background: #F8FAFC;
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.live-ex-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.live-ex-name {
  font-size: 0.98rem;
  font-weight: 800;
  color: var(--text-primary);
}

.live-ex-badges {
  display: flex;
  gap: 6px;
}

.badge-pill {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.badge-pill.orange {
  background: rgba(255, 107, 53, 0.15);
  color: var(--accent-primary);
  border: 1px solid rgba(255, 107, 53, 0.3);
}

.badge-pill.neutral {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}

.live-ex-note {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Sets Table */
.sets-table-wrapper {
  overflow-x: auto;
}

.sets-table {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
  font-size: 0.8rem;
}

.sets-table th {
  padding: 8px 6px;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
}

.sets-table td {
  padding: 8px 4px;
  vertical-align: middle;
}

.set-row-completed {
  background: rgba(255, 107, 53, 0.05);
}

.set-num-cell {
  font-weight: 800;
  color: var(--text-secondary);
}

.set-input {
  width: 74px;
  padding: 8px;
  text-align: center;
  font-weight: 800;
  font-size: 0.9rem;
}

.set-select.rpe {
  padding: 8px 6px;
  font-weight: 700;
  font-size: 0.85rem;
}

.set-check-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
}

.set-check-btn.checked {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #FFFFFF;
}

.add-set-row {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}

.add-set-btn {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-primary);
  background: rgba(255, 107, 53, 0.1);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
}

/* Floating Rest Timer */
.floating-rest-timer {
  position: fixed;
  bottom: 80px;
  right: 18px;
  z-index: 50;
  background: rgba(22, 22, 26, 0.96);
  border: 1px solid var(--accent-primary);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 16px rgba(255, 107, 53, 0.25);
  backdrop-filter: blur(12px);
  border-radius: var(--radius-lg);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.rest-timer-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.timer-pulse {
  animation: pulseDot 1s infinite;
}

.rest-timer-label {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--accent-secondary);
}

.rest-timer-countdown {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--text-primary);
  line-height: 1;
}

.rest-timer-actions {
  display: flex;
  gap: 6px;
}

.rest-action-btn {
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 800;
}

.rest-action-btn.plus {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

.rest-action-btn.skip {
  background: rgba(255, 107, 53, 0.2);
  color: var(--accent-primary);
}

/* Sticky banner if workout runs outside of Entrenar tab */
.live-workout-sticky-bar {
  position: sticky;
  top: 68px;
  z-index: 39;
  background: linear-gradient(90deg, #1A1614 0%, #221A16 100%);
  border-bottom: 1px solid rgba(255, 107, 53, 0.4);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.sticky-bar-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--text-primary);
}

.sticky-bar-btn {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-primary);
}

/* Empty live session */
.empty-live-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 40px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-live-box h3 {
  font-size: 1.15rem;
  font-weight: 800;
}

.empty-live-box p {
  font-size: 0.85rem;
  color: var(--text-secondary);
  max-width: 380px;
}

.cta-primary-btn {
  background: linear-gradient(135deg, #FF6B35 0%, #E85923 100%);
  color: #FFFFFF;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
  margin-top: 6px;
}

/* Exercise Library & BodyMap */
.search-filter-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 14px;
}

.search-input {
  flex: 1;
  background: none;
  border: none;
  padding: 0;
  font-size: 0.9rem;
}

.clear-search-btn {
  color: var(--text-muted);
}

.equipment-chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.equipment-chip {
  padding: 6px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}

.equipment-chip.active {
  background: rgba(255, 107, 53, 0.15);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

/* BodyMap Container */
.bodymap-container-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bodymap-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.section-subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.sex-toggle-group {
  display: flex;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  padding: 3px;
  gap: 2px;
}

.sex-toggle-btn {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
}

.sex-toggle-btn.active {
  background: var(--accent-primary);
  color: #FFFFFF;
}

.bodymap-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
}

.bodymap-stage {
  width: 100%;
  max-width: 390px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.bodymap-labels-top {
  width: 100%;
  display: flex;
  justify-content: space-around;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.bodymap-svg {
  width: 100%;
  height: auto;
  max-height: 380px;
}

.bodymap-legend {
  display: flex;
  gap: 14px;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 6px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.legend-dot.orange { background: var(--accent-primary); }
.legend-dot.emerald { background: var(--accent-glp1); }
.legend-dot.neutral { background: #3F3F4E; }

.active-muscles-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.active-muscle-chip {
  background: rgba(255, 107, 53, 0.15);
  border: 1px solid var(--accent-primary);
  color: var(--accent-primary);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
}

.clear-all-muscles {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-decoration: underline;
}

/* Exercises Results Grid */
.exercises-results-header {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.exercise-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.exercise-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: all 0.2s ease;
}

.exercise-card:hover {
  border-color: var(--border-active);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}

.exercise-card-art {
  background: #F8FAFC;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.exercise-card-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ex-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.25;
}

.ex-name-en {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.ex-tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.ex-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-full);
}

.ex-badge.primary {
  background: rgba(255, 107, 53, 0.15);
  color: var(--accent-primary);
}

.ex-badge.eq {
  background: var(--bg-elevated);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
}

/* Exercise Art Box */
.exercise-art-box {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.exercise-art-box.fallback {
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
}

.exercise-art-badge {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(13, 13, 15, 0.85);
  color: #FFFFFF;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  backdrop-filter: blur(4px);
}

/* Modal Overlay & Sheet */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.18s ease;
}

.modal-sheet {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 18px 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
}

.modal-subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.modal-close-btn {
  color: var(--text-muted);
  padding: 4px;
}

.modal-close-btn:hover {
  color: var(--text-primary);
}

.modal-art-stage {
  background: #F8FAFC;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-body-content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.modal-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.meta-box {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.meta-label {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.meta-val {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-primary);
}

.meta-val.orange {
  color: var(--accent-primary);
}

.steps-title {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.steps-list {
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.45;
}

.modal-action-btn.primary {
  width: 100%;
  background: linear-gradient(135deg, #FF6B35 0%, #E85923 100%);
  color: #FFFFFF;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 0.9rem;
  box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
}

/* Programs Tab */
.filter-chips-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.filter-chip {
  padding: 8px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-secondary);
  white-space: nowrap;
}

.filter-chip.active {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #FFFFFF;
}

.programs-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.program-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color 0.2s ease;
}

.program-card.is-active-program {
  border-color: var(--accent-primary);
  background: linear-gradient(145deg, #181514 0%, #16161A 100%);
}

.program-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.program-badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.program-cat-badge {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.program-cat-badge.emerald {
  background: rgba(16, 185, 129, 0.15);
  color: var(--accent-glp1);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.program-cat-badge.orange {
  background: rgba(255, 107, 53, 0.15);
  color: var(--accent-primary);
  border: 1px solid rgba(255, 107, 53, 0.3);
}

.active-label {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--accent-secondary);
}

.program-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
}

.program-focus {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-top: 4px;
}

.program-duration-box {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}

.program-glp1-tip {
  background: rgba(16, 185, 129, 0.07);
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-size: 0.8rem;
  color: #D1FAE5;
  line-height: 1.4;
}

.program-glp1-tip strong {
  color: var(--accent-glp1);
}

.program-days-accordion {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.program-day-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.day-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-primary);
}

.day-ex-count {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-left: 8px;
}

.start-day-btn {
  background: linear-gradient(135deg, #FF6B35 0%, #E85923 100%);
  color: #FFFFFF;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 800;
}

.program-card-footer {
  display: flex;
  justify-content: flex-end;
}

.set-active-program-btn {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 8px 14px;
  border-radius: var(--radius-md);
}

.set-active-program-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-active);
}

/* Nutrition Tab Styles */
.diary-macro-summary-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.diary-rings-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.diary-macro-circle {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 2px;
}

.diary-macro-circle.emerald { border-color: rgba(16, 185, 129, 0.4); }
.diary-macro-circle.orange { border-color: rgba(255, 107, 53, 0.4); }
.diary-macro-circle.cyan { border-color: rgba(56, 189, 248, 0.4); }

.circle-val {
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--text-primary);
}

.circle-lbl {
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.circle-sub {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.add-food-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
}

.card-subtitle {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text-primary);
}

.add-food-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form-row-multi {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.form-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.form-input, .form-select {
  width: 100%;
