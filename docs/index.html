<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0F12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GymMane GLP-1 · Fuerza y Salud Metabólica (Mounjaro / Ozempic)</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <style>
    html, body, #root { min-height: 100%; width: 100%; margin: 0; padding: 0; background-color: #0E0F12; }
    /* ==========================================================================
   GymMane GLP-1 — Material Design 3 (M3) Official System
   Based on Google's M3 Guidelines, adaptive-apps-samples & material-components-android
   ========================================================================== */

:root {
  /* M3 Dark Color Scheme (Custom Fitness & Clinical Palette) */
  --md-sys-color-primary: #FF8A65;
  --md-sys-color-on-primary: #521E06;
  --md-sys-color-primary-container: #772C00;
  --md-sys-color-on-primary-container: #FFDBCF;

  --md-sys-color-secondary: #E3BEB1;
  --md-sys-color-on-secondary: #422B22;
  --md-sys-color-secondary-container: #3E2D27;
  --md-sys-color-on-secondary-container: #FFDBCF;

  --md-sys-color-tertiary: #5BDBB1;
  --md-sys-color-on-tertiary: #003828;
  --md-sys-color-tertiary-container: #00513C;
  --md-sys-color-on-tertiary-container: #79F8CD;

  --md-sys-color-error: #FFB4AB;
  --md-sys-color-on-error: #690005;
  --md-sys-color-error-container: #93000A;
  --md-sys-color-on-error-container: #FFDAD6;

  /* M3 Surface Tonal Hierarchy (Dark Mode) */
  --md-sys-color-background: #0E0F12;
  --md-sys-color-on-background: #E2E2E6;
  --md-sys-color-surface: #111216;
  --md-sys-color-on-surface: #E2E2E6;
  --md-sys-color-surface-dim: #0B0C0F;
  --md-sys-color-surface-bright: #36373C;
  --md-sys-color-surface-container-lowest: #090A0D;
  --md-sys-color-surface-container-low: #15161A;
  --md-sys-color-surface-container: #191A1F;
  --md-sys-color-surface-container-high: #23242A;
  --md-sys-color-surface-container-highest: #2D2E35;
  --md-sys-color-on-surface-variant: #C4C6CF;
  --md-sys-color-outline: #8E9099;
  --md-sys-color-outline-variant: #44474E;
  --md-sys-color-scrim: #000000;

  /* M3 Elevations */
  --md-sys-elevation-level1: 0px 1px 3px 1px rgba(0, 0, 0, 0.35), 0px 1px 2px 0px rgba(0, 0, 0, 0.45);
  --md-sys-elevation-level2: 0px 2px 6px 2px rgba(0, 0, 0, 0.40), 0px 1px 2px 0px rgba(0, 0, 0, 0.50);
  --md-sys-elevation-level3: 0px 4px 8px 3px rgba(0, 0, 0, 0.45), 0px 1px 3px 0px rgba(0, 0, 0, 0.55);

  /* M3 Shape Tokens */
  --md-sys-shape-corner-none: 0px;
  --md-sys-shape-corner-extra-small: 4px;
  --md-sys-shape-corner-small: 8px;
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px;
  --md-sys-shape-corner-extra-large: 28px;
  --md-sys-shape-corner-full: 9999px;

  /* M3 Motion & Easing */
  --md-sys-motion-easing-standard: cubic-bezier(0.2, 0.0, 0, 1.0);
  --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0.0, 1.0);
  --md-sys-motion-duration-short: 150ms;
  --md-sys-motion-duration-medium: 250ms;
  --md-sys-motion-duration-long: 350ms;

  /* Typography Fonts */
  --md-ref-typeface-brand: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --md-ref-typeface-plain: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-background);
  font-family: var(--md-ref-typeface-plain);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--md-sys-color-background);
  min-height: 100dvh;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  outline: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
  transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              transform 100ms var(--md-sys-motion-easing-standard);
}

button:active {
  transform: scale(0.98);
}

input, select, textarea {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface);
  border-radius: var(--md-sys-shape-corner-extra-small);
  padding: 10px 14px;
  outline: none;
  font-size: 0.9rem;
  transition: border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

input:focus, select:focus, textarea:focus {
  border-color: var(--md-sys-color-primary);
  background-color: var(--md-sys-color-surface-container-high);
}

.num-tabular, .tabular-nums {
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   Adaptive Layout Structure (Compact, Medium & Expanded - Google Adaptive Apps)
   ========================================================================== */

.adaptive-app-shell {
  display: flex;
  min-height: 100dvh;
  width: 100%;
  background-color: var(--md-sys-color-background);
  position: relative;
}

/* Side Navigation Rail (Desktop / Tablet >= 768px) */
.m3-navigation-rail {
  display: none;
  width: 88px;
  flex-shrink: 0;
  background-color: var(--md-sys-color-surface);
  border-right: 1px solid var(--md-sys-color-outline-variant);
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0 20px 0;
  position: sticky;
  top: 0;
  height: 100dvh;
  z-index: 50;
}

.rail-top-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
}

.rail-brand-logo {
  width: 44px;
  height: 44px;
  border-radius: var(--md-sys-shape-corner-medium);
  background-color: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--md-sys-elevation-level1);
}

.rail-nav-items {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  align-items: center;
}

.rail-item-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 76px;
  padding: 4px 0;
  color: var(--md-sys-color-on-surface-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.rail-item-btn:hover {
  color: var(--md-sys-color-on-surface);
}

.rail-item-btn.active {
  color: var(--md-sys-color-on-surface);
}

.rail-indicator-pill {
  width: 56px;
  height: 32px;
  border-radius: var(--md-sys-shape-corner-full);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.rail-item-btn.active .rail-indicator-pill {
  background-color: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
}

.rail-label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.rail-bottom-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* Main Adaptive Content Area */
.adaptive-main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  padding-bottom: 92px; /* space for compact NavigationBar */
}

/* M3 Top App Bar */
.m3-top-app-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: 64px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: rgba(17, 18, 22, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
}

.top-bar-headline-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.top-bar-title {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--md-sys-color-on-surface);
  line-height: 1.2;
}

.top-bar-subtitle {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--md-sys-color-tertiary);
  text-transform: uppercase;
}

.top-bar-trailing-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* M3 User Pill */
.m3-profile-capsule {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--md-sys-color-on-surface);
}

.m3-profile-capsule:hover {
  background-color: var(--md-sys-color-surface-container-high);
}

.capsule-badge-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: var(--md-sys-color-tertiary);
}

.m3-icon-button {
  width: 40px;
  height: 40px;
  border-radius: var(--md-sys-shape-corner-full);
  color: var(--md-sys-color-on-surface-variant);
  display: flex;
  align-items: center;
  justify-content: center;
}

.m3-icon-button:hover {
  background-color: var(--md-sys-color-surface-container-high);
  color: var(--md-sys-color-on-surface);
}

/* Content Container */
.content-scroller {
  flex: 1;
  padding: 20px 20px 32px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.tab-pane-view {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: m3PaneIn var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
}

@keyframes m3PaneIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   M3 Cards (Elevated, Filled & Outlined)
   ========================================================================== */

.m3-card {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-large);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: var(--md-sys-elevation-level1);
  transition: box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.m3-card:hover {
  box-shadow: var(--md-sys-elevation-level2);
  border-color: var(--md-sys-color-outline);
}

.m3-card.primary-tint {
  background-color: var(--md-sys-color-surface-container-high);
  border-color: rgba(255, 138, 101, 0.35);
}

.card-header-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.card-header-title {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--md-sys-color-on-surface);
}

.card-header-eyebrow {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--md-sys-color-primary);
  text-transform: uppercase;
}

/* M3 Segmented Buttons */
.m3-segmented-button-row {
  display: flex;
  background-color: var(--md-sys-color-surface-container-lowest);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-full);
  padding: 3px;
  gap: 3px;
  overflow-x: auto;
}

.m3-segment-item {
  flex: 1;
  padding: 8px 14px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.m3-segment-item:hover {
  color: var(--md-sys-color-on-surface);
}

.m3-segment-item.active {
  background-color: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
  font-weight: 700;
  box-shadow: var(--md-sys-elevation-level1);
}

/* M3 Buttons */
.m3-btn-filled {
  background-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  padding: 12px 20px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: var(--md-sys-elevation-level1);
}

.m3-btn-filled:hover {
  box-shadow: var(--md-sys-elevation-level2);
}

.m3-btn-tonal {
  background-color: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
  padding: 11px 18px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.85rem;
  font-weight: 600;
}

.m3-btn-tonal:hover {
  background-color: #4A342D;
}

.m3-btn-outlined {
  background-color: transparent;
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface);
  padding: 10px 18px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.82rem;
  font-weight: 600;
}

.m3-btn-outlined:hover {
  border-color: var(--md-sys-color-outline);
  background-color: rgba(255, 255, 255, 0.04);
}

.m3-btn-tertiary {
  background-color: var(--md-sys-color-tertiary);
  color: var(--md-sys-color-on-tertiary);
  padding: 11px 18px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.85rem;
  font-weight: 700;
}

.m3-btn-tertiary:hover {
  box-shadow: var(--md-sys-elevation-level2);
}

/* M3 Chips */
.m3-chips-flow {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.m3-chip {
  height: 34px;
  padding: 0 14px;
  border-radius: var(--md-sys-shape-corner-small);
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap;
}

.m3-chip:hover {
  border-color: var(--md-sys-color-outline);
  color: var(--md-sys-color-on-surface);
}

.m3-chip.active {
  background-color: var(--md-sys-color-primary-container);
  border-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary-container);
  font-weight: 700;
}

/* ==========================================================================
   Telemetry & Health Monitoring Components (Hoy Tab)
   ========================================================================== */

/* 7-Day Cycle Block */
.m3-cycle-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cycle-hero-banner {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cycle-hero-title {
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.015em;
  color: var(--md-sys-color-on-surface);
}

.cycle-hero-desc {
  font-size: 0.82rem;
  color: var(--md-sys-color-on-surface-variant);
  line-height: 1.45;
}

.cycle-seven-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cycle-day-box {
  height: 38px;
  background-color: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-small);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--md-sys-color-on-surface-variant);
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.cycle-day-box.passed {
  background-color: var(--md-sys-color-tertiary-container);
  color: var(--md-sys-color-on-tertiary-container);
  border-color: rgba(91, 219, 177, 0.4);
}

.cycle-day-box.current {
  background-color: var(--md-sys-color-tertiary);
  color: var(--md-sys-color-on-tertiary);
  font-weight: 900;
  box-shadow: var(--md-sys-elevation-level2);
}

.cycle-day-sub {
  font-size: 0.62rem;
  opacity: 0.8;
}

.cycle-action-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--md-sys-color-surface-container-low);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  padding: 10px 14px;
  font-size: 0.78rem;
  color: var(--md-sys-color-on-surface-variant);
}

.cycle-action-strip strong {
  color: var(--md-sys-color-on-surface);
}

/* Linear Determinate Macro Progress (M3 ProgressIndicator) */
.macro-telemetry-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.m3-progress-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.progress-label-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 0.8rem;
}

.progress-title-text {
  font-weight: 700;
  color: var(--md-sys-color-on-surface);
}

.progress-title-text.hero-protein {
  color: var(--md-sys-color-tertiary);
}

.progress-value-text {
  font-weight: 700;
  color: var(--md-sys-color-on-surface);
}

.progress-value-text .dim {
  color: var(--md-sys-color-outline);
  font-weight: 500;
}

.m3-linear-track {
  height: 8px;
  background-color: var(--md-sys-color-surface-container-highest);
  border-radius: var(--md-sys-shape-corner-full);
  overflow: hidden;
  position: relative;
}

.m3-linear-fill {
  height: 100%;
  border-radius: var(--md-sys-shape-corner-full);
  transition: width var(--md-sys-motion-duration-long) var(--md-sys-motion-easing-emphasized);
}

.m3-linear-fill.tertiary { background-color: var(--md-sys-color-tertiary); }
.m3-linear-fill.primary { background-color: var(--md-sys-color-primary); }
.m3-linear-fill.secondary { background-color: #38BDF8; }
.m3-linear-fill.warning { background-color: var(--md-sys-color-secondary); }

.macro-secondary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding-top: 6px;
  border-top: 1px solid var(--md-sys-color-outline-variant);
}

.macro-mini-kpi {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.kpi-title {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--md-sys-color-outline);
  text-transform: uppercase;
}

.kpi-value {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--md-sys-color-on-surface);
}

/* Hydration Control Bar */
.m3-hydration-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--md-sys-color-surface-container-low);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  padding: 12px 16px;
}

.hydration-summary-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.hydration-title-val {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--md-sys-color-on-surface);
}

.hydration-subtext {
  font-size: 0.72rem;
  color: var(--md-sys-color-outline);
}

.hydration-actions-col {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ==========================================================================
   Workout & GymMane Training Screen (Hevy / Strong / M3 Engineering)
   ========================================================================== */

.live-workout-header-card {
  background-color: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-large);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--md-sys-elevation-level1);
}

.workout-duration-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background-color: var(--md-sys-color-surface-container-lowest);
  border: 1px solid var(--md-sys-color-outline-variant);
  padding: 6px 14px;
  border-radius: var(--md-sys-shape-corner-full);
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--md-sys-color-primary);
}

/* Set Table Container */
.m3-table-card {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.table-ex-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.table-ex-thumb {
  width: 64px;
  height: 64px;
  background-color: #F8FAFC;
  border-radius: var(--md-sys-shape-corner-medium);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.table-ex-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.table-ex-name {
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--md-sys-color-on-surface);
}

.table-ex-tags {
  display: flex;
  gap: 6px;
  font-size: 0.7rem;
}

.ex-tag-item {
  background-color: var(--md-sys-color-surface-container-highest);
  padding: 2px 8px;
  border-radius: var(--md-sys-shape-corner-extra-small);
  color: var(--md-sys-color-on-surface-variant);
  font-weight: 600;
}

/* M3 Workout Sets Table */
.m3-sets-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.m3-sets-table th {
  padding: 8px 6px;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--md-sys-color-outline);
  text-align: center;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
}

.m3-sets-table td {
  padding: 8px 4px;
  text-align: center;
  vertical-align: middle;
}

.set-index-cell {
  font-weight: 800;
  color: var(--md-sys-color-on-surface-variant);
}

.set-input-box {
  width: 72px;
  padding: 8px 6px;
  text-align: center;
  font-weight: 800;
  font-size: 0.95rem;
  border-radius: var(--md-sys-shape-corner-small);
}

.set-complete-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--md-sys-shape-corner-medium);
  background-color: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-outline);
}

.set-complete-btn.checked {
  background-color: var(--md-sys-color-primary);
  border-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
}

/* Floating Rest Timer Bar */
.m3-rest-floating-sheet {
  position: fixed;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 780px;
  z-index: 46;
  background-color: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--md-sys-color-outline);
  box-shadow: var(--md-sys-elevation-level3);
  border-radius: var(--md-sys-shape-corner-large);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: m3SheetIn var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
}

@keyframes m3SheetIn {
  from { opacity: 0; transform: translate(-50%, 12px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.rest-left-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rest-title-eyebrow {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--md-sys-color-primary);
  text-transform: uppercase;
}

.rest-countdown-clock {
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--md-sys-color-on-surface);
  line-height: 1;
}

/* ==========================================================================
   BodyMap Anatomical Component (M3 Slate & Primary Highlight)
   ========================================================================== */

.bodymap-surface-card {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-large);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bodymap-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
}

.bodymap-stage {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.bodymap-labels-top {
  width: 100%;
  display: flex;
  justify-content: space-around;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--md-sys-color-outline);
  text-transform: uppercase;
}

.bodymap-svg {
  width: 100%;
  height: auto;
  max-height: 360px;
}

.bodymap-legend {
  display: flex;
  gap: 14px;
  font-size: 0.72rem;
  color: var(--md-sys-color-on-surface-variant);
  margin-top: 6px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.legend-dot.orange { background-color: var(--md-sys-color-primary); }
.legend-dot.emerald { background-color: var(--md-sys-color-tertiary); }
.legend-dot.neutral { background-color: #3F3F4E; }

/* Exercises Grid */
.m3-exercise-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.m3-exercise-tile {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.m3-exercise-tile:hover {
  background-color: var(--md-sys-color-surface-container-high);
  border-color: var(--md-sys-color-outline);
  transform: translateY(-2px);
}

.tile-art-stage {
  background-color: #F8FAFC;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile-content-pad {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.tile-name {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--md-sys-color-on-surface);
  line-height: 1.25;
}

.tile-sub {
  font-size: 0.7rem;
  color: var(--md-sys-color-outline);
}

/* ==========================================================================
   M3 Bottom Navigation Bar (Mobile / Compact < 768px)
   ========================================================================== */

.m3-navigation-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 45;
  height: 80px;
  background-color: rgba(17, 18, 22, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--md-sys-color-outline-variant);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px calc(env(safe-area-inset-bottom, 0px));
}

.m3-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 100%;
  color: var(--md-sys-color-on-surface-variant);
  position: relative;
  transition: color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.m3-nav-indicator {
  width: 64px;
  height: 32px;
  border-radius: var(--md-sys-shape-corner-full);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

.m3-nav-item.active .m3-nav-indicator {
  background-color: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
}

.m3-nav-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.m3-nav-item.active .m3-nav-label {
  color: var(--md-sys-color-on-surface);
  font-weight: 700;
}

/* ==========================================================================
   M3 Modal Sheet & Dialogs
   ========================================================================== */

.m3-modal-scrim {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  background-color: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: m3ScrimIn var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}

@keyframes m3ScrimIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.m3-modal-sheet {
  background-color: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-extra-large);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--md-sys-elevation-level3);
  display: flex;
  flex-direction: column;
}

.m3-drag-handle-bar {
  width: 32px;
  height: 4px;
  border-radius: var(--md-sys-shape-corner-full);
  background-color: var(--md-sys-color-outline);
  margin: 12px auto 6px auto;
}

.m3-modal-top {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
}

.m3-modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--md-sys-color-on-surface);
}

.m3-modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Snackbar / Toast */
.m3-snackbar {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  background-color: var(--md-sys-color-surface-container-highest);
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface);
  padding: 10px 22px;
  border-radius: var(--md-sys-shape-corner-small);
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: var(--md-sys-elevation-level3);
  white-space: nowrap;
}

/* ==========================================================================
   Adaptive Breakpoint: Tablet & Desktop (>= 768px)
   ========================================================================== */

@media (min-width: 768px) {
  .m3-navigation-bar {
    display: none;
  }
  .m3-navigation-rail {
    display: flex;
  }
  .adaptive-main-area {
    padding-bottom: 32px;
    margin: 0;
  }
  .adaptive-app-shell {
    justify-content: center;
  }
}
