:"Dumbbell Bench Press",primary:"chest",secondary:["triceps"],equipment:"Dumbbell",difficulty:"Intermediate",art:"dumbbell-bench-press",steps:["T\xFAmbate en el banco con los pies apoyados en el suelo y la espalda pegada al banco.","Sujeta una mancuerna en cada mano, con las palmas hacia delante y los brazos estirados encima del pecho.","Baja las mancuernas despacio a los lados del pecho, con los codos a 90 grados.","Aguanta un momento y empuja las mancuernas de vuelta a la posici\xF3n inicial, estirando los brazos del todo.","Repite las repeticiones que quieras."]},{id:"ns0SIbU",name:"Press inclinado con mancuernas",nameEn:"Dumbbell Incline Bench Press",primary:"chest",secondary:["triceps"],equipment:"Dumbbell",difficulty:"Intermediate",art:"incline-dumbbell-press",steps:["Coloca un banco inclinado a 45 grados.","Si\xE9ntate en el banco con los pies apoyados en el suelo y la espalda bien pegada al respaldo.","Sujeta una mancuerna en cada mano con las palmas hacia delante y s\xFAbelas a la altura de los hombros.","Baja las mancuernas despacio a los lados del pecho, con los codos a 90 grados.","Empuja las mancuernas de vuelta a la posici\xF3n inicial estirando los brazos del todo."]},{id:"yz9nUhF",name:"Aperturas con mancuernas",nameEn:"Dumbbell Fly",primary:"chest",secondary:[],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-fly",steps:["T\xFAmbate en un banco con una mancuerna en cada mano y las palmas enfrentadas.","Estira los brazos hacia arriba encima del pecho, con los codos algo flexionados.","Con los codos algo flexionados, baja los brazos a los lados en un arco amplio hasta notar el estiramiento en el pecho.","Aguanta un momento, invierte el movimiento y sube las mancuernas a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"I4hDWkc",name:"Flexiones",nameEn:"Push-up",primary:"chest",secondary:["triceps"],equipment:"Bodyweight",difficulty:"Intermediate",art:"push-up",steps:["Empieza en plancha alta con las manos algo m\xE1s abiertas que los hombros y los pies juntos.","Aprieta el core y baja el cuerpo hacia el suelo flexionando los codos, manteni\xE9ndote en l\xEDnea recta.","Aguanta un momento con el pecho justo encima del suelo y empuja para volver a la posici\xF3n inicial estirando los brazos.","Repite las repeticiones que quieras."]},{id:"9WTm7dq",name:"Fondos en paralelas para pecho",nameEn:"Chest Dip",primary:"chest",secondary:["triceps"],equipment:"Bodyweight",difficulty:"Intermediate",art:"chest-dip",steps:["Col\xF3cate en las paralelas con los brazos estirados del todo y el cuerpo recto.","Baja el cuerpo flexionando los codos hasta que los hombros queden por debajo de ellos.","Empuja para volver a la posici\xF3n inicial estirando los brazos.","Repite las repeticiones que quieras."]},{id:"9XjtHvS",name:"Pullover con mancuerna",nameEn:"Dumbbell Pullover",primary:"chest",secondary:["triceps"],equipment:"Dumbbell",difficulty:"Intermediate",art:"dumbbell-pullover",steps:["T\xFAmbate en el banco con la cabeza en un extremo y los pies en el suelo.","Sujeta una mancuerna con las dos manos y estira los brazos encima del pecho.","Con los codos algo flexionados, baja la mancuerna despacio por detr\xE1s de la cabeza hasta notar el estiramiento en pecho y hombros.","Aguanta un momento y sube la mancuerna a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"PAgTVaK",name:"Fondos de pecho asistidos (de rodillas)",nameEn:"Assisted Chest Dip (Kneeling)",primary:"chest",secondary:["triceps"],equipment:"Machine",difficulty:"Beginner",art:"assisted-dip",steps:["Ajusta la m\xE1quina a la altura que quieras y apoya bien las rodillas en la almohadilla.","Agarra las asas con las palmas hacia abajo y los brazos estirados del todo.","Baja el cuerpo flexionando los codos hasta que los brazos queden paralelos al suelo.","Aguanta un momento y empuja para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"A9qxk2F",name:"Flexiones de arquero",nameEn:"Archer Push Up",primary:"chest",secondary:["triceps"],equipment:"Bodyweight",difficulty:"Intermediate",art:"archer-push-up",steps:["Ponte en posici\xF3n de flexi\xF3n con las manos algo m\xE1s abiertas que los hombros.","Estira un brazo hacia el lado, paralelo al suelo.","Baja el cuerpo flexionando los codos, con la espalda recta y el core apretado.","Empuja para volver a la posici\xF3n inicial.","Repite con el otro lado, estirando el brazo contrario."]},{id:"0CXGHya",name:"Cruces en polea",nameEn:"Cable Crossover",primary:"chest",secondary:["triceps"],equipment:"Cable",difficulty:"Beginner",art:"cable-fly",steps:["Ajusta las poleas a la altura del pecho.","Ponte en el centro de la m\xE1quina con un pie por delante del otro.","Agarra las asas con las palmas hacia abajo y los brazos abiertos a los lados.","Da un paso adelante, con los brazos algo flexionados.","Con los codos algo flexionados, junta las manos delante del pecho."]},{id:"A6wtbuL",name:"Press militar de pie con mancuernas",nameEn:"Dumbbell Standing Overhead Press",primary:"shoulders",secondary:["triceps","back"],equipment:"Dumbbell",difficulty:"Intermediate",art:"standing-dumbbell-press",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano a la altura de los hombros, con las palmas hacia delante.","Empuja las mancuernas hacia arriba hasta estirar los brazos del todo sobre la cabeza.","Aguanta un momento arriba y baja las mancuernas despacio a la altura de los hombros.","Repite las repeticiones que quieras."]},{id:"Xy4jlWA",name:"Press Arnold con mancuernas",nameEn:"Dumbbell Arnold Press",primary:"shoulders",secondary:["triceps"],equipment:"Dumbbell",difficulty:"Intermediate",art:"arnold-press",steps:["Si\xE9ntate en un banco con respaldo y sujeta una mancuerna en cada mano a la altura de los hombros, con las palmas hacia ti y los codos flexionados.","Empuja las mancuernas hacia arriba hasta estirar los brazos del todo, con las palmas hacia delante.","Gira las mu\xF1ecas mientras subes, de modo que arriba las palmas miren hacia delante.","Aguanta un momento arriba y baja las mancuernas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"DsgkuIt",name:"Elevaciones laterales con mancuernas",nameEn:"Dumbbell Lateral Raise",primary:"shoulders",secondary:["trapezius"],equipment:"Dumbbell",difficulty:"Beginner",art:"lateral-raise",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano, con las palmas hacia ti.","Mant\xE9n la espalda recta y aprieta el core.","Sube los brazos a los lados hasta dejarlos paralelos al suelo, con los codos algo flexionados.","Aguanta un momento arriba y baja los brazos despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"goJ6ezq",name:"Elevaciones laterales en polea",nameEn:"Cable Lateral Raise",primary:"shoulders",secondary:["trapezius","triceps"],equipment:"Cable",difficulty:"Beginner",art:"cable-lateral-raise",steps:["Ponte de pie con los pies a la anchura de los hombros y agarra las asas de la polea en pronaci\xF3n.","Mant\xE9n los brazos estirados y el core apretado.","Sube los brazos a los lados hasta dejarlos paralelos al suelo.","Aguanta un momento arriba y baja los brazos despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"3eGE2JC",name:"Elevaciones frontales con mancuernas",nameEn:"Dumbbell Front Raise",primary:"shoulders",secondary:["biceps"],equipment:"Dumbbell",difficulty:"Beginner",art:"front-raise",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano, con las palmas mirando a los muslos.","Con los brazos estirados, suelta el aire y sube las mancuernas por delante hasta la altura de los hombros.","Aguanta un momento arriba, coge aire y baja las mancuernas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"v1qBec9",name:"P\xE1jaros con mancuernas",nameEn:"Dumbbell Rear Lateral Raise",primary:"shoulders",secondary:["trapezius"],equipment:"Dumbbell",difficulty:"Beginner",art:"rear-delt-fly",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano, con las palmas hacia ti.","Flexiona un poco las rodillas e incl\xEDnate desde la cadera, con la espalda recta y el core apretado.","Sube los brazos a los lados, con los codos algo flexionados, hasta dejarlos paralelos al suelo.","Aguanta un momento arriba y baja los brazos despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"myfUsKf",name:"P\xE1jaros en m\xE1quina",nameEn:"Machine Reverse Fly",primary:"shoulders",secondary:[],equipment:"Machine",difficulty:"Beginner",art:"reverse-pec-deck",steps:["Ajusta la altura del asiento y col\xF3cate con el pecho contra la almohadilla y los pies apoyados en el suelo.","Agarra las asas en pronaci\xF3n y mant\xE9n los brazos algo flexionados.","Suelta el aire y junta las esc\xE1pulas mientras llevas las asas atr\xE1s y hacia fuera.","Aguanta un momento en la m\xE1xima contracci\xF3n, coge aire y vuelve despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"aqvSOQE",name:"Aperturas inversas en polea",nameEn:"Cable Reverse Fly",primary:"shoulders",secondary:[],equipment:"Cable",difficulty:"Beginner",art:"cable-rear-delt-fly",steps:["Pon las dos poleas a la altura de los hombros y col\xF3cate en el centro.","Coge el agarre izquierdo con la mano derecha y el derecho con la izquierda, cruzando los cables.","Sujeta los brazos por delante con los codos un poco flexionados.","Abre los brazos hacia fuera y atr\xE1s hasta alinearlos con los hombros.","Deja que los brazos vuelvan a juntarse por delante despacio."]},{id:"67n3r98",name:"Press de hombro en m\xE1quina",nameEn:"Lever Shoulder Press",primary:"shoulders",secondary:["triceps"],equipment:"Machine",difficulty:"Beginner",art:"machine-shoulder-press",steps:["Ajusta la altura del asiento y col\xF3cate con la espalda contra el respaldo.","Agarra las asas en pronaci\xF3n y col\xF3calas a la altura de los hombros.","Empuja las asas hacia arriba hasta estirar los brazos, sin bloquear los codos.","Aguanta un momento arriba y baja las asas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"NJzBsGJ",name:"Encogimientos con mancuernas",nameEn:"Dumbbell Shrug",primary:"trapezius",secondary:[],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-shrug",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano, con las palmas hacia el cuerpo.","Mant\xE9n los brazos estirados y deja las mancuernas colgando a los lados.","Sube los hombros todo lo que puedas, como si quisieras tocarte las orejas con ellos.","Aguanta la contracci\xF3n un segundo y baja los hombros despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"Eg98Ft9",name:"Encogimientos en polea",nameEn:"Cable Shrug",primary:"trapezius",secondary:[],equipment:"Cable",difficulty:"Beginner",art:"cable-shrug",steps:["Ponte de pie frente a la polea con los pies a la anchura de los hombros.","Agarra las asas en pronaci\xF3n y deja los brazos colgando por delante.","Con los brazos estirados, encoge los hombros hacia las orejas.","Aguanta un momento la contracci\xF3n y baja los hombros despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"7xeukSt",name:"Fondos escapulares",nameEn:"Scapula Dips",primary:"trapezius",secondary:[],equipment:"Bodyweight",difficulty:"Intermediate",art:"dip",steps:["Empieza de pie con los pies a la anchura de los hombros y los brazos estirados por delante.","Flexiona un poco las rodillas e incl\xEDnate hacia delante desde la cadera, con la espalda recta.","Baja el cuerpo flexionando los codos y juntando las esc\xE1pulas, como si quisieras sujetar un l\xE1piz entre ellas.","Aguanta un momento abajo y empuja con las manos para estirar los codos y volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"uTBt1HV",name:"Dominadas escapulares",nameEn:"Scapular Pull-up",primary:"trapezius",secondary:["biceps"],equipment:"Bodyweight",difficulty:"Intermediate",art:"scapular-pull-up",steps:["Empieza colgado de la barra en pronaci\xF3n, con los brazos estirados del todo.","Lleva las esc\xE1pulas hacia abajo y atr\xE1s.","Aprieta la espalda y sube el cuerpo hacia la barra, centr\xE1ndote en juntar las esc\xE1pulas.","Aguanta un momento arriba y baja el cuerpo despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"OUQ0ZyW",name:"Encogimientos en multipower",nameEn:"Smith Shrug",primary:"trapezius",secondary:[],equipment:"Machine",difficulty:"Beginner",art:"smith-shrug",steps:["Ponte de pie con los pies a la anchura de los hombros y las rodillas algo flexionadas.","Agarra la barra en pronaci\xF3n, con las manos algo m\xE1s abiertas que los hombros.","Mant\xE9n los brazos estirados y los hombros relajados.","Sube los hombros hacia las orejas, apretando el trapecio arriba.","Aguanta un momento y baja los hombros despacio a la posici\xF3n inicial."]},{id:"dG7tG5y",name:"Encogimientos con barra",nameEn:"Barbell Shrug",primary:"trapezius",secondary:[],equipment:"Barbell",difficulty:"Beginner",art:"shrug",steps:["Ponte de pie con los pies a la anchura de los hombros y sujeta la barra delante de ti en pronaci\xF3n.","Mant\xE9n los brazos y la espalda rectos durante todo el ejercicio.","Sube los hombros hacia las orejas todo lo que puedas, apretando el trapecio arriba.","Aguanta un momento y baja los hombros despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"kettlebell-high-pull",name:"High pull con kettlebell",nameEn:"Kettlebell High Pull",primary:"trapezius",secondary:["shoulders","glutes"],equipment:"Kettlebell",difficulty:"Advanced",art:"upright-row",steps:["Col\xF3cate como para un swing, con la kettlebell entre los pies.","Lleva la cadera atr\xE1s, pasa la pesa entre las piernas y empuja la cadera hacia delante.","Cuando la pesa sube, tira del codo alto y hacia atr\xE1s.","La pesa acaba delante del hombro, no por encima de la cabeza.","Acomp\xE1\xF1ala de vuelta hacia el siguiente movimiento de cadera."]},{id:"kettlebell-shrug",name:"Encogimientos con kettlebell",nameEn:"Kettlebell Shrug",primary:"trapezius",secondary:[],equipment:"Kettlebell",difficulty:"Beginner",art:"dumbbell-shrug",steps:["De pie y erguido, con una kettlebell en cada mano a los lados.","Mant\xE9n los brazos estirados y la barbilla recogida.","Sube los hombros en l\xEDnea recta hacia las orejas.","Aguanta arriba sin rotar los hombros.","B\xE1jalos despacio hasta el final."]},{id:"RRWFUcw",name:"Zancadas con mancuernas",nameEn:"Dumbbell Lunge",primary:"glutes",secondary:["hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"walking-lunge",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano.","Da un paso adelante con el pie derecho y baja a la zancada.","Mant\xE9n la espalda recta y el pecho alto mientras bajas.","Empuja con el tal\xF3n derecho para volver a la posici\xF3n inicial.","Repite con la pierna izquierda."]},{id:"OM46QHm",name:"Pull through en polea con cuerda",nameEn:"Cable Pull Through (With Rope)",primary:"glutes",secondary:["hamstrings"],equipment:"Cable",difficulty:"Beginner",art:"cable-pull-through",steps:["Ponte de pie de espaldas a la polea con los pies a la anchura de los hombros.","Agarra la cuerda con las dos manos y da un paso adelante para tensar el cable.","Incl\xEDnate desde la cadera y baja el tronco hasta dejarlo paralelo al suelo, con la espalda recta.","Aprieta gl\xFAteos e isquios para subir el cuerpo a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"c8f5cSY",name:"Abducci\xF3n de cadera tumbado de lado",nameEn:"Side Lying Hip Abduction",primary:"glutes",secondary:["obliques"],equipment:"Bodyweight",difficulty:"Intermediate",art:"side-lying-hip-abduction",steps:["T\xFAmbate de lado con las piernas estiradas y una encima de la otra.","Pon el brazo de abajo bajo la cabeza para apoyarte.","Aprieta el lateral del gl\xFAteo y sube la pierna de arriba todo lo que puedas sin girar la cadera ni echarte atr\xE1s.","Aguanta un momento arriba y baja la pierna despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de lado."]},{id:"mnzcrIB",name:"Sentadilla al banco con mancuernas",nameEn:"Dumbbell Bench Squat",primary:"glutes",secondary:["hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"dumbbell-bench-squat",steps:["Deja una mancuerna en el suelo delante de un banco.","Ponte de espaldas al banco con los pies a la anchura de los hombros.","Flexiona rodillas y cadera para bajar hacia el banco, con el pecho alto y la espalda recta.","Cuando los gl\xFAteos toquen el banco, empuja con los talones para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"1bQkKZK",name:"Buenos d\xEDas en multipower",nameEn:"Smith Good Morning",primary:"glutes",secondary:["hamstrings","lowerback"],equipment:"Machine",difficulty:"Beginner",art:"smith-good-morning",steps:["Empieza de pie con los pies a la anchura de los hombros y las puntas hacia delante.","Apoya la barra en la parte alta de la espalda, sobre el trapecio.","Flexiona un poco las rodillas e incl\xEDnate hacia delante desde la cadera, con la espalda recta.","Baja el tronco hasta dejarlo paralelo al suelo, notando el estiramiento en los isquios.","Aprieta gl\xFAteos e isquios para subir el tronco a la posici\xF3n inicial."]},{id:"Kpajagk",name:"Extensi\xF3n de cadera de pie en polea",nameEn:"Cable Standing Hip Extension",primary:"glutes",secondary:["hamstrings"],equipment:"Cable",difficulty:"Beginner",art:"cable-kickback",steps:["Engancha un cable a la polea baja y ponte de espaldas a la m\xE1quina.","P\xE1sate el cable por el tobillo y ponte con los pies a la anchura de los hombros.","Mant\xE9n el core apretado y la espalda recta durante todo el ejercicio.","Estira la pierna despacio hacia atr\xE1s, apretando el gl\xFAteo arriba.","Aguanta un momento y vuelve a la posici\xF3n inicial."]},{id:"UfePqpx",name:"Peso muerto rumano en multipower",nameEn:"Smith Romanian Deadlift",primary:"glutes",secondary:["hamstrings","lowerback"],equipment:"Machine",difficulty:"Advanced",art:"smith-machine-romanian-deadlift",steps:["Pon la barra del multipower a media altura del muslo y ag\xE1rrala justo por fuera de las piernas.","Desbloquea la barra y ponte erguido con las rodillas un poco flexionadas.","Lleva la cadera atr\xE1s y desliza la barra por los muslos con la espalda plana.","Para cuando notes el estiramiento en los isquiotibiales.","Lleva la cadera adelante para volver a ponerte de pie."]},{id:"BbfB8Gb",name:"Toque de puntas b\xE1sico",nameEn:"Basic Toe Touch",primary:"glutes",secondary:["hamstrings","calves"],equipment:"Bodyweight",difficulty:"Intermediate",art:"toe-touch",steps:["Ponte de pie con los pies a la anchura de los hombros y los brazos a los lados.","Incl\xEDnate hacia delante, con la espalda recta y las rodillas algo flexionadas.","Baja las manos hacia las puntas de los pies, con las piernas lo m\xE1s estiradas posible.","Aguanta un momento abajo y vuelve despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"ecl28tP",name:"Zancada frontal contralateral con mancuerna",nameEn:"Dumbbell Contralateral Forward Lunge",primary:"glutes",secondary:["hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"forward-lunge",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano.","Da un paso adelante con el pie derecho, con la espalda recta y el core apretado.","Baja flexionando las dos rodillas hasta que el muslo derecho quede paralelo al suelo.","Empuja con el tal\xF3n derecho para volver a la posici\xF3n inicial.","Repite con la pierna izquierda."]},{id:"BJ0Hz5L",name:"Remo con mancuernas",nameEn:"Dumbbell Bent Over Row",primary:"back",secondary:["biceps","forearm","lowerback"],equipment:"Dumbbell",difficulty:"Intermediate",art:"dumbbell-bent-over-row",steps:["Ponte de pie con los pies a la anchura de los hombros, las rodillas algo flexionadas y una mancuerna en cada mano, con las palmas hacia el cuerpo.","Incl\xEDnate hacia delante desde la cadera, con la espalda recta y el core apretado.","Deja los brazos colgando hacia el suelo, con los codos algo flexionados.","Sube las mancuernas hacia el pecho juntando las esc\xE1pulas.","Aguanta un momento arriba y baja las mancuernas despacio a la posici\xF3n inicial."]},{id:"fUBheHs",name:"Remo sentado en polea",nameEn:"Cable Seated Row",primary:"back",secondary:["biceps","forearm"],equipment:"Cable",difficulty:"Beginner",art:"seated-row",steps:["Si\xE9ntate en la m\xE1quina de remo con los pies apoyados en los reposapi\xE9s y las rodillas algo flexionadas.","Agarra las asas en pronaci\xF3n, con la espalda recta y los hombros relajados.","Tira de las agarraderas hacia el cuerpo juntando las esc\xE1pulas.","Aguanta un momento en el punto m\xE1ximo y suelta las agarraderas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"RVwzP10",name:"Jal\xF3n al pecho en polea",nameEn:"Cable Pulldown",primary:"back",secondary:["biceps","forearm"],equipment:"Cable",difficulty:"Beginner",art:"lat-pulldown",steps:["Ajusta la m\xE1quina de jal\xF3n para que el asiento quede a una altura c\xF3moda y la almohadilla te sujete las rodillas.","Si\xE9ntate con la espalda recta y los pies apoyados en el suelo.","Agarra la barra de la polea en pronaci\xF3n, algo m\xE1s abierto que la anchura de los hombros.","\xC9chate un poco hacia atr\xE1s y aprieta el core.","Tira de la barra hacia el pecho juntando las esc\xE1pulas."]},{id:"lBDjFxJ",name:"Dominadas",nameEn:"Pull-up",primary:"back",secondary:["biceps","forearm"],equipment:"Bodyweight",difficulty:"Intermediate",art:"pull-up",steps:["Cu\xE9lgate de la barra en pronaci\xF3n, con los brazos estirados del todo.","Aprieta el core y junta las esc\xE1pulas.","Sube el cuerpo hacia la barra flexionando los codos y llevando el pecho hacia ella.","Aguanta arriba y baja el cuerpo despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"T2mxWqc",name:"Dominadas supinas",nameEn:"Chin-up",primary:"back",secondary:["biceps","forearm"],equipment:"Bodyweight",difficulty:"Intermediate",art:"chin-up",steps:["Cu\xE9lgate de la barra en supinaci\xF3n, con las manos a la anchura de los hombros.","Aprieta el core y sube el cuerpo hacia la barra, llevando el pecho por delante.","Sigue tirando hasta pasar la barbilla por encima de la barra.","Aguanta un momento arriba y baja el cuerpo despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"7vG5o25",name:"Remo inclinado con mancuernas",nameEn:"Dumbbell Incline Row",primary:"back",secondary:["biceps"],equipment:"Dumbbell",difficulty:"Intermediate",art:"chest-supported-row",steps:["Coloca un banco inclinado a 45 grados.","Coge una mancuerna en cada mano y si\xE9ntate en el banco con el pecho contra el respaldo inclinado.","Estira los brazos del todo, dejando las mancuernas colgando desde los hombros.","Sube las mancuernas hacia el pecho juntando las esc\xE1pulas.","Aguanta un momento arriba y baja las mancuernas despacio a la posici\xF3n inicial."]},{id:"72BC5Za",name:"Dominadas de arquero",nameEn:"Archer Pull Up",primary:"back",secondary:["biceps","forearm"],equipment:"Bodyweight",difficulty:"Intermediate",art:"pull-up",steps:["Empieza colgado de la barra en pronaci\xF3n, algo m\xE1s abierto que la anchura de los hombros.","Aprieta el core y lleva las esc\xE1pulas abajo y atr\xE1s.","Al subir, flexiona un brazo llevando el codo al costado mientras mantienes el otro estirado.","Sigue tirando hasta pasar la barbilla por encima de la barra con el brazo flexionado del todo.","Baja controlando, estira el brazo flexionado y repite hacia el otro lado."]},{id:"PbzNu7c",name:"Elevaci\xF3n en Y inclinada con mancuernas",nameEn:"Dumbbell Incline Y-raise",primary:"back",secondary:[],equipment:"Dumbbell",difficulty:"Beginner",art:"prone-y-raise",steps:["Pon un banco inclinado a 45 grados y si\xE9ntate con una mancuerna en cada mano, palmas hacia dentro.","Incl\xEDnate un poco hacia delante y deja los brazos colgando, con los codos algo flexionados.","Sube los brazos a los lados formando una Y hasta dejarlos paralelos al suelo.","Aguanta un momento arriba y baja los brazos despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"kiJ4Z2K",name:"Dominadas asistidas",nameEn:"Assisted Pull-up",primary:"back",secondary:["biceps","forearm"],equipment:"Machine",difficulty:"Beginner",art:"assisted-pull-up",steps:["Ajusta la m\xE1quina al peso y la altura que quieras.","Agarra las agarraderas en pronaci\xF3n, algo m\xE1s abierto que la anchura de los hombros.","Cu\xE9lgate con los brazos estirados del todo y los pies en el aire.","Aprieta la espalda y sube el cuerpo hacia las asas, con los codos pegados al cuerpo.","Sigue tirando hasta pasar la barbilla por encima de las asas."]},{id:"yn8yg1r",name:"Sentadilla goblet con mancuerna",nameEn:"Dumbbell Goblet Squat",primary:"quads",secondary:["glutes","hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"goblet-squat",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en vertical contra el pecho, sujeta con las dos manos.","Con el pecho alto y el core apretado, baja a la sentadilla llevando la cadera atr\xE1s y flexionando las rodillas.","Sigue bajando hasta que los muslos queden paralelos al suelo, o hasta donde llegues c\xF3modo.","Aguanta un momento abajo y empuja con los talones para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"7zdxRTl",name:"Prensa de piernas",nameEn:"Leg Press",primary:"quads",secondary:["glutes","hamstrings"],equipment:"Machine",difficulty:"Beginner",art:"leg-press",steps:["Si\xE9ntate en la prensa con la espalda pegada al respaldo.","Pon los pies a la anchura de los hombros en el centro de la plataforma.","Suelta los seguros y baja la plataforma hasta que las rodillas queden a unos 90 grados.","Empuja la plataforma con los talones hasta casi estirar las piernas.","Para antes de bloquear las rodillas y vuelve a bajar controlando."]},{id:"qx4fgX7",name:"Sentadilla b\xFAlgara a una pierna con mancuernas",nameEn:"Dumbbell Single Leg Split Squat",primary:"quads",secondary:["glutes","hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"split-squat",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano.","Da un paso adelante con un pie y col\xF3cate de modo que el pie de delante quede plano en el suelo y el de atr\xE1s elevado sobre un banco o step.","Baja el cuerpo flexionando la rodilla y la cadera de delante, con la rodilla de atr\xE1s algo flexionada y el tal\xF3n despegado.","Sigue bajando hasta que el muslo de delante quede paralelo al suelo y empuja con ese tal\xF3n para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de pierna."]},{id:"gFyFj9z",name:"Subida al caj\xF3n con mancuernas",nameEn:"Dumbbell Step-up",primary:"quads",secondary:["glutes","hamstrings","calves"],equipment:"Dumbbell",difficulty:"Intermediate",art:"step-up",steps:["Ponte delante de un step o plataforma con una mancuerna en cada mano, palmas hacia el cuerpo.","Apoya el pie derecho en el step, con toda la planta sobre la superficie.","Empuja con el tal\xF3n derecho y sube al step, llevando tambi\xE9n el pie izquierdo.","Con los dos pies arriba, baja el izquierdo a la posici\xF3n inicial manteniendo el derecho en el step.","Repite el movimiento alternando el pie con el que subes."]},{id:"hBGWILP",name:"Aducci\xF3n de cadera en polea",nameEn:"Cable Hip Adduction",primary:"quads",secondary:["glutes"],equipment:"Cable",difficulty:"Beginner",art:"cable-standing-hip-adduction",steps:["Ponte la tobillera y col\xF3cate de pie frente a la polea.","Sep\xE1rate lo suficiente de la m\xE1quina para que el cable quede tenso.","Apoya las manos en la m\xE1quina para sujetarte.","Con la pierna estirada, ll\xE9vala despacio cruzando el cuerpo hacia el centro.","Aguanta un momento al final y vuelve despacio a la posici\xF3n inicial."]},{id:"wWFspEi",name:"Sentadilla b\xFAlgara a una pierna en multipower",nameEn:"Smith Single Leg Split Squat",primary:"quads",secondary:["glutes","hamstrings"],equipment:"Machine",difficulty:"Beginner",art:"smith-machine-split-squat",steps:["Ponte delante del multipower con los pies a la anchura de los hombros.","Apoya un pie por detr\xE1s en un banco o step, con la punta hacia delante.","Ag\xE1rrate a la barra del multipower para estabilizarte.","Flexiona la rodilla de delante y baja a la zancada, con la espalda recta.","Aguanta un momento abajo y empuja con el tal\xF3n de delante para volver a la posici\xF3n inicial."]},{id:"6YUfHPL",name:"Sentadilla sin peso",nameEn:"Bodyweight Squat",primary:"quads",secondary:["hamstrings","glutes"],equipment:"Bodyweight",difficulty:"Intermediate",art:"bodyweight-squat",steps:["Ponte de pie con los pies a la anchura de los hombros.","Baja flexionando las rodillas y llevando la cadera atr\xE1s, como si fueras a sentarte.","Mant\xE9n el pecho alto y la espalda recta.","Baja hasta que los muslos queden paralelos al suelo.","Empuja con los talones para volver a la posici\xF3n inicial."]},{id:"mweqJin",name:"Pies r\xE1pidos",nameEn:"Quick Feet",primary:"quads",secondary:["calves","hamstrings"],equipment:"Bodyweight",difficulty:"Intermediate",art:"fast-feet",steps:["Ponte de pie con los pies a la anchura de los hombros y los brazos a los lados.","Empieza moviendo los pies r\xE1pido arriba y abajo, como si corrieras en el sitio.","Mant\xE9n el movimiento r\xE1pido y ligero, apoy\xE1ndote en la punta de los pies.","Sigue el tiempo o las repeticiones que quieras."]},{id:"W31mMjd",name:"Zancada lateral",nameEn:"Lateral Lunge",primary:"quads",secondary:["glutes","hamstrings","calves"],equipment:"Bodyweight",difficulty:"Intermediate",art:"lateral-lunge",steps:["Ponte de pie con los pies muy separados y las manos juntas delante del pecho.","Pasa el peso a una pierna y flexiona esa rodilla llevando la cadera atr\xE1s.","Mant\xE9n la otra pierna estirada con el pie apoyado en el suelo.","Baja hasta que el muslo quede casi paralelo al suelo.","Vuelve al centro y repite hacia el otro lado."]},{id:"FkBIE6a",name:"Curl femoral tumbado con mancuerna",nameEn:"Dumbbell Lying Leg Curl",primary:"hamstrings",secondary:["glutes"],equipment:"Dumbbell",difficulty:"Intermediate",art:"lying-leg-curl",steps:["T\xFAmbate boca abajo en un banco plano con las rodillas justo fuera del borde.","Pide que te pongan una mancuerna entre los pies y apri\xE9tala fuerte.","Lleva los talones hacia los gl\xFAteos levantando la mancuerna.","Mant\xE9n la cadera pegada al banco arriba.","Baja la mancuerna despacio hasta casi estirar las piernas."]},{id:"LNE3wfo",name:"Estiramiento de isquios con toalla",nameEn:"Towel Hamstring Stretch",primary:"hamstrings",secondary:["glutes"],equipment:"Bodyweight",difficulty:"Intermediate",art:"towel-hamstring-curl",steps:["T\xFAmbate boca arriba y pasa una toalla por la planta de un pie.","Sujeta un extremo de la toalla con cada mano.","Estira esa pierna y s\xFAbela hacia el techo.","Para cuando notes el estiramiento en la parte de atr\xE1s del muslo y aguanta.","Baja la pierna despacio y cambia de lado."]},{id:"C5jncD2",name:"Curl femoral tumbado",nameEn:"Lying Leg Curl",primary:"hamstrings",secondary:["glutes"],equipment:"Machine",difficulty:"Beginner",art:"leg-curl",steps:["T\xFAmbate boca abajo en la m\xE1quina de femoral con el rodillo justo por encima de los talones.","Alinea las rodillas con el eje de la m\xE1quina y sujeta las asas.","Lleva los talones hacia los gl\xFAteos todo lo que puedas.","Aprieta los isquiotibiales arriba sin levantar la cadera.","Baja el rodillo despacio hasta casi estirar las piernas."]},{id:"seated-leg-curl",name:"Curl femoral sentado",nameEn:"Seated Leg Curl",primary:"hamstrings",secondary:["calves"],equipment:"Machine",difficulty:"Beginner",art:"seated-leg-curl",steps:["Si\xE9ntate en la m\xE1quina con el rodillo sobre la parte baja de las espinillas.","Baja el rodillo de los muslos para que las piernas no se levanten.","Sujeta las asas y mant\xE9n la espalda pegada al respaldo.","Flexiona las rodillas llevando los talones hacia atr\xE1s todo lo que puedas.","Deja que las piernas se estiren despacio contra la resistencia."]},{id:"single-leg-romanian-deadlift",name:"Peso muerto rumano a una pierna",nameEn:"Single-Leg Romanian Deadlift",primary:"hamstrings",secondary:["glutes","abdomen"],equipment:"Dumbbell",difficulty:"Advanced",art:"single-leg-romanian-deadlift",steps:["Ponte de pie sobre una pierna con una mancuerna en la mano contraria.","Mant\xE9n la rodilla de apoyo un poco flexionada.","Incl\xEDnate hacia delante dejando que la pierna libre suba por detr\xE1s.","Baja hasta que el tronco y la pierna queden casi paralelos al suelo.","Aprieta el gl\xFAteo para volver a subir sin apoyar el pie."]},{id:"lying-hamstring-walkout",name:"Caminata de isquios en el suelo",nameEn:"Lying Hamstring Walkout",primary:"hamstrings",secondary:["glutes","abdomen"],equipment:"Bodyweight",difficulty:"Intermediate",art:"lying-hamstring-walkout",steps:["T\xFAmbate boca arriba con las rodillas flexionadas y sube la cadera a puente.","Mant\xE9n la cadera arriba durante todo el ejercicio.","Anda con los talones hacia fuera hasta casi estirar las piernas.","Vuelve andando con los talones hacia dentro.","Para si la cadera empieza a caerse hacia el suelo."]},{id:"hamstring-stretch",name:"Estiramiento de isquiotibiales",nameEn:"Hamstring Stretch",primary:"hamstrings",secondary:["calves","back"],equipment:"Bodyweight",difficulty:"Beginner",art:"hamstring-stretch",steps:["Si\xE9ntate en el suelo con una pierna estirada y la otra recogida.","Mant\xE9n la espalda larga en vez de redondearla.","Incl\xEDnate hacia delante sobre la pierna estirada.","Alcanza hacia el pie hasta notar el tir\xF3n del isquiotibial.","Aguanta el estiramiento y cambia de pierna."]},{id:"seated-forward-fold-stretch",name:"Flexi\xF3n sentado hacia delante",nameEn:"Seated Forward Fold",primary:"hamstrings",secondary:["back","calves"],equipment:"Bodyweight",difficulty:"Beginner",art:"seated-forward-fold-stretch",steps:["Si\xE9ntate en el suelo con las dos piernas estiradas por delante.","Ponte erguido apoyado en los isquiones.","Incl\xEDnate desde la cadera y estira las manos hacia los pies.","Deja que la cabeza y el cuello se relajen al doblarte.","Aguanta y respira dentro del estiramiento."]},{id:"bodyweight-romanian-deadlift",name:"Peso muerto rumano sin peso",nameEn:"Bodyweight Romanian Deadlift",primary:"hamstrings",secondary:["glutes","lowerback"],equipment:"Bodyweight",difficulty:"Beginner",art:"romanian-deadlift",steps:["Ponte de pie con los pies a la anchura de la cadera y las manos sobre los muslos.","Deja las rodillas ligeramente dobladas y la espalda plana.","Lleva la cadera hacia atr\xE1s y desliza las manos por las piernas.","Para cuando notes el estiramiento en la parte de atr\xE1s del muslo.","Aprieta los gl\xFAteos para llevar la cadera de nuevo bajo el cuerpo."]},{id:"IeDEXTe",name:"Elevaci\xF3n de gemelos en prensa",nameEn:"Leg Press Calf Raise",primary:"calves",secondary:["hamstrings","glutes"],equipment:"Machine",difficulty:"Beginner",art:"leg-press-calf-raise",steps:["Ajusta el asiento de la prensa para que las rodillas queden algo flexionadas con los pies en la plataforma.","Si\xE9ntate en la m\xE1quina con la espalda contra el respaldo y los pies apoyados en la plataforma, a la anchura de los hombros.","Apoya la punta de los pies en la plataforma, con los talones fuera del borde.","Quita los seguros y empuja la plataforma estirando las rodillas.","Con las rodillas estiradas del todo, baja los talones despacio flexionando los gemelos."]},{id:"ykUOVze",name:"Elevaci\xF3n de gemelos de pie en m\xE1quina",nameEn:"Lever Standing Calf Raise",primary:"calves",secondary:[],equipment:"Machine",difficulty:"Beginner",art:"standing-calf-raise",steps:["Ajusta la m\xE1quina a tu altura y ponte con los pies a la anchura de los hombros.","Mete los hombros bajo las almohadillas y ag\xE1rrate a las asas para estabilizarte.","Sube los talones todo lo que puedas estirando los tobillos.","Aguanta un momento arriba y baja los talones despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"bJYHBIN",name:"Elevaci\xF3n de gemelos de pie sin peso",nameEn:"Bodyweight Standing Calf Raise",primary:"calves",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"calf-raise",steps:["Ponte de pie con los pies a la anchura de los hombros y las puntas hacia delante.","Apoya las manos en una pared o superficie estable para el equilibrio.","Sube los talones despacio, qued\xE1ndote sobre la punta de los pies.","Aguanta un momento arriba y baja los talones despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"iPm26QU",name:"Bajada controlada del caj\xF3n",nameEn:"Step-down",primary:"calves",secondary:["hamstrings","glutes"],equipment:"Bodyweight",difficulty:"Intermediate",art:"step-down",steps:["S\xFAbete a un caj\xF3n bajo o un escal\xF3n sobre una pierna.","Deja la otra pierna colgando justo fuera del borde.","Flexiona despacio la rodilla de apoyo para bajar el tal\xF3n libre hacia el suelo.","Toca el suelo suavemente sin apoyar el peso en \xE9l.","Estira la pierna de apoyo para volver a subir y cambia de pierna al acabar la serie."]},{id:"VW88JNd",name:"Elevaci\xF3n de gemelos sentado a una pierna con mancuerna",nameEn:"Dumbbell Seated One Leg Calf Raise",primary:"calves",secondary:["hamstrings","glutes"],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-seated-one-leg-calf-raise",steps:["Si\xE9ntate en un banco con la parte delantera de un pie sobre un escal\xF3n bajo y el tal\xF3n en el aire.","Apoya una mancuerna encima de esa rodilla y suj\xE9tala.","Empuja con la punta del pie para subir el tal\xF3n todo lo que puedas.","Aguanta arriba apretando el gemelo.","Baja el tal\xF3n despacio por debajo del escal\xF3n y cambia de pierna al acabar la serie."]},{id:"ywaNfuh",name:"Elevaci\xF3n de gemelos en multipower",nameEn:"Smith Calf Raise",primary:"calves",secondary:["hamstrings"],equipment:"Machine",difficulty:"Beginner",art:"smith-reverse-calf-raise",steps:["Pon la barra del multipower a la altura de los hombros y col\xF3cate debajo.","Apoya la barra en la parte alta de la espalda y pisa un escal\xF3n bajo con la parte delantera de los pies.","Desbloquea la barra y deja los talones en el aire.","Sube de puntillas todo lo que puedas.","Baja los talones despacio por debajo del escal\xF3n."]},{id:"u5ESqzH",name:"Elevaci\xF3n de gemelos tipo burro",nameEn:"Donkey Calf Raise",primary:"calves",secondary:["hamstrings","glutes"],equipment:"Bodyweight",difficulty:"Beginner",art:"donkey-calf-raise",steps:["Ponte con las puntas de los pies en una superficie elevada, como un step o un taco.","Apoya las manos en algo estable, como una pared o una barandilla, para el equilibrio.","Sube los talones todo lo que puedas, qued\xE1ndote sobre la punta de los pies.","Aguanta un momento arriba y baja los talones despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"1kB3Wmk",name:"Elevaci\xF3n de gemelos a una pierna con mancuerna",nameEn:"Dumbbell Single Leg Calf Raise",primary:"calves",secondary:[],equipment:"Dumbbell",difficulty:"Beginner",art:"single-leg-calf-raise",steps:["Ponte en el borde de un step o plataforma con los talones al aire y las puntas apoyadas.","Sujeta una mancuerna en una mano y apoya la otra en una pared o barandilla.","Sube el tal\xF3n todo lo que puedas, qued\xE1ndote de puntillas.","Aguanta un momento arriba y baja el tal\xF3n despacio por debajo del step.","Repite las repeticiones que quieras y cambia de pierna."]},{id:"0jp9Rlz",name:"Elevaci\xF3n de gemelos a una pierna en el suelo",nameEn:"One Leg Floor Calf Raise",primary:"calves",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"single-leg-calf-raise",steps:["Ponte de pie con los pies a la anchura de la cadera y apoya las manos en una pared o algo resistente.","Despega un pie del suelo y mant\xE9n el equilibrio sobre el otro.","Sube el tal\xF3n despacio, qued\xE1ndote sobre la punta del pie.","Aguanta un momento arriba y baja el tal\xF3n despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de pierna."]},{id:"NbVPDMW",name:"Curl de b\xEDceps con mancuernas",nameEn:"Dumbbell Biceps Curl",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"bicep-curl",steps:["Ponte de pie con una mancuerna en cada mano, las palmas hacia delante y los brazos estirados del todo.","Con los brazos quietos, suelta el aire y sube el peso contrayendo el b\xEDceps.","Sigue subiendo el peso hasta contraer el b\xEDceps del todo, con las mancuernas a la altura de los hombros.","Aguanta un instante en la contracci\xF3n apretando el b\xEDceps.","Coge aire y empieza a bajar las mancuernas despacio a la posici\xF3n inicial."]},{id:"slDvUAU",name:"Curl martillo con mancuernas",nameEn:"Dumbbell Hammer Curl",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"hammer-curl",steps:["Ponte de pie con una mancuerna en cada mano y las palmas mirando al cuerpo.","Mant\xE9n los codos pegados al cuerpo y gira las palmas hasta que miren hacia delante.","Esa es la posici\xF3n inicial.","Ahora, con los brazos quietos, suelta el aire y sube el peso contrayendo el b\xEDceps.","Sigue subiendo el peso hasta contraer el b\xEDceps del todo, con las mancuernas a la altura de los hombros."]},{id:"gvsWLQw",name:"Curl concentrado con mancuerna",nameEn:"Dumbbell Concentration Curl",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"concentration-curl",steps:["Si\xE9ntate en un banco con las piernas abiertas y una mancuerna en una mano, apoyando el codo en la cara interna del muslo.","Estira el brazo del todo y sujeta la mancuerna en supinaci\xF3n.","Con el brazo quieto, suelta el aire y sube el peso hacia el hombro contrayendo el b\xEDceps.","Sigue subiendo la mancuerna hasta contraer el b\xEDceps del todo, con la mancuerna a la altura del hombro.","Aguanta un instante en la contracci\xF3n apretando el b\xEDceps."]},{id:"fy7Tgy4",name:"Curl predicador martillo alterno con mancuernas",nameEn:"Dumbbell Alternate Hammer Preacher Curl",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-hammer-preacher-curl",steps:["Si\xE9ntate en el banco predicador con una mancuerna en cada mano, palmas hacia el cuerpo y brazos estirados del todo.","Mant\xE9n los brazos quietos y suelta el aire mientras subes el peso contrayendo el b\xEDceps.","Sigue subiendo las mancuernas hasta contraer el b\xEDceps del todo, con las mancuernas a la altura de los hombros.","Aguanta un instante en la contracci\xF3n apretando el b\xEDceps.","Coge aire y empieza a bajar las mancuernas despacio a la posici\xF3n inicial."]},{id:"NlfIbzq",name:"Curl predicador alterno con mancuernas",nameEn:"Dumbbell Alternate Preacher Curl",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-one-arm-preacher-curl",steps:["Si\xE9ntate en el banco predicador con una mancuerna en cada mano, palmas hacia arriba.","Apoya los brazos en la almohadilla del banco predicador, dej\xE1ndolos estirarse del todo.","Con los brazos quietos, suelta el aire y sube la mancuerna de la mano derecha contrayendo el b\xEDceps.","Sigue subiendo la mancuerna hasta contraer el b\xEDceps del todo, con la mancuerna a la altura del hombro.","Aguanta un momento, coge aire y baja la mancuerna despacio a la posici\xF3n inicial."]},{id:"G08RZcQ",name:"Curl de b\xEDceps en polea",nameEn:"Cable Curl",primary:"biceps",secondary:["forearm"],equipment:"Cable",difficulty:"Beginner",art:"cable-curl",steps:["Ponte de pie frente a la polea con los pies a la anchura de los hombros.","Agarra el accesorio de la polea en supinaci\xF3n, con las palmas hacia arriba.","Mant\xE9n los codos pegados al cuerpo y los brazos quietos.","Suelta el aire y sube el accesorio hacia los hombros contrayendo el b\xEDceps.","Aguanta un momento arriba apretando el b\xEDceps."]},{id:"Zwiw7XR",name:"Curl de b\xEDceps alterno con pierna elevada en fitball",nameEn:"Dumbbell Alternating Bicep Curl with Leg Raised on Exercise Ball",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"bicep-curl",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en cada mano, con las palmas hacia delante.","Pon un fitball detr\xE1s de ti y apoya un pie encima, manteniendo el equilibrio.","Con los brazos estirados del todo y los codos pegados al cuerpo, sube una mancuerna hacia el hombro manteniendo el brazo quieto.","Baja la mancuerna a la posici\xF3n inicial y repite con el otro brazo.","Sigue alternando brazos durante las repeticiones que quieras."]},{id:"HPlPoQA",name:"Curl martillo en polea con cuerda",nameEn:"Cable Hammer Curl (With Rope)",primary:"biceps",secondary:["forearm"],equipment:"Cable",difficulty:"Beginner",art:"rope-hammer-curl",steps:["Ponte de pie con los pies a la anchura de los hombros y las rodillas algo flexionadas.","Sujeta la cuerda de la polea con las palmas enfrentadas y los brazos estirados del todo.","Con los brazos quietos, suelta el aire y sube el peso contrayendo el b\xEDceps.","Sigue subiendo la cuerda hasta contraer el b\xEDceps del todo, con la cuerda a la altura de los hombros.","Aguanta un instante en la contracci\xF3n apretando el b\xEDceps."]},{id:"J74XlNf",name:"Curl de b\xEDceps sentado alterno en fitball",nameEn:"Dumbbell Alternating Seated Bicep Curl on Exercise Ball",primary:"biceps",secondary:["forearm"],equipment:"Dumbbell",difficulty:"Beginner",art:"ball-seated-curl",steps:["Si\xE9ntate en un fitball con los pies apoyados en el suelo y la espalda recta.","Sujeta una mancuerna en cada mano con las palmas hacia delante y los brazos estirados del todo.","Con los brazos quietos, suelta el aire y sube una mancuerna girando el antebrazo hasta que la palma mire al hombro.","Coge aire y baja la mancuerna despacio a la posici\xF3n inicial.","Repite el curl con el otro brazo."]},{id:"3ZflifB",name:"Extensi\xF3n de tr\xEDceps en polea",nameEn:"Cable Pushdown",primary:"triceps",secondary:["forearm"],equipment:"Cable",difficulty:"Beginner",art:"tricep-pushdown",steps:["Engancha una barra recta a una polea alta.","Ponte de pie frente a la m\xE1quina con los pies a la anchura de los hombros y las rodillas algo flexionadas.","Agarra la barra en pronaci\xF3n, con las manos a la anchura de los hombros.","Mant\xE9n los codos pegados al cuerpo y los brazos quietos.","Suelta el aire y empuja la barra hacia abajo hasta estirar los codos del todo."]},{id:"PdmaD0N",name:"Extensi\xF3n de tr\xEDceps de pie con mancuerna",nameEn:"Dumbbell Standing Triceps Extension",primary:"triceps",secondary:[],equipment:"Dumbbell",difficulty:"Beginner",art:"dumbbell-overhead-tricep-extension",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en una mano.","Sube la mancuerna por encima de la cabeza con el brazo estirado.","Flexiona el codo y baja la mancuerna por detr\xE1s de la cabeza, con el brazo quieto.","Estira el brazo de vuelta a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"2IxROQ1",name:"Extensi\xF3n de tr\xEDceps sobre la cabeza en polea con cuerda",nameEn:"Cable Overhead Triceps Extension (Rope Attachment)",primary:"triceps",secondary:[],equipment:"Cable",difficulty:"Beginner",art:"overhead-tricep-extension",steps:["Engancha una cuerda a la polea en posici\xF3n alta.","Ponte de pie de espaldas a la m\xE1quina con los pies a la anchura de los hombros.","Agarra la cuerda con las dos manos, palmas enfrentadas, y ll\xE9valas por encima de la cabeza.","Mant\xE9n los brazos pegados a la cabeza y los codos apuntando hacia delante.","Baja la cuerda despacio por detr\xE1s de la cabeza flexionando los codos."]},{id:"X6C6i5Y",name:"Fondos en paralelas para tr\xEDceps",nameEn:"Triceps Dip",primary:"triceps",secondary:[],equipment:"Bodyweight",difficulty:"Intermediate",art:"dip",steps:["Si\xE9ntate en el borde de un banco o una silla agarrando el borde, con los dedos hacia delante.","Desliza el culo fuera del banco y aguanta el peso con las manos.","Flexiona los codos y baja el cuerpo hacia el suelo, con la espalda pegada al banco.","Aguanta un momento abajo y empuja para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"7jGOBF3",name:"Press con mancuernas y agarre cerrado",nameEn:"Dumbbell Close Grip Press",primary:"triceps",secondary:[],equipment:"Dumbbell",difficulty:"Intermediate",art:"close-grip-bench-press",steps:["Si\xE9ntate en un banco plano con una mancuerna en cada mano, apoyadas en los muslos.","Ay\xFAdate de los muslos para subir las mancuernas de una en una y sujetarlas delante de ti, a la anchura de los hombros.","Ya a esa altura, gira las mu\xF1ecas hacia delante para que las palmas miren hacia fuera. Esa es la posici\xF3n inicial.","Coge aire y baja las mancuernas despacio a los lados, hasta la altura del pecho.","Suelta el aire y sube las mancuernas con el tr\xEDceps hasta la posici\xF3n inicial. Tira solo con el tr\xEDceps, sin ayudarte de antebrazos ni b\xEDceps."]},{id:"RrLske5",name:"Fondos en banco (rodillas flexionadas)",nameEn:"Bench Dip (Knees Bent)",primary:"triceps",secondary:[],equipment:"Bodyweight",difficulty:"Intermediate",art:"bench-dip",steps:["Si\xE9ntate en el borde de un banco o una silla agarrando el borde junto a la cadera.","Desliza el culo fuera del banco y estira las piernas por delante, con los talones en el suelo.","Flexiona los codos y baja el cuerpo hacia el suelo, con la espalda pegada al banco.","Aguanta un momento abajo y empuja para volver a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"Db7eEgw",name:"Extensi\xF3n concentrada en polea (sobre la rodilla)",nameEn:"Cable Concentration Extension (On Knee)",primary:"triceps",secondary:["forearm"],equipment:"Cable",difficulty:"Beginner",art:"cable-kneeling-concentration-extension",steps:["Si\xE9ntate en un banco o una silla con las rodillas flexionadas y los pies apoyados.","Sujeta el asa con la mano derecha y apoya el codo en la cara interna de la rodilla derecha.","Estira el brazo del todo, con el codo quieto y pegado a la rodilla.","Aguanta un momento arriba y baja el brazo despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de lado."]},{id:"Ser9eQp",name:"Extensi\xF3n de tr\xEDceps en m\xE1quina",nameEn:"Machine Triceps Extension",primary:"triceps",secondary:[],equipment:"Machine",difficulty:"Beginner",art:"machine-triceps-extension",steps:["Ajusta el asiento para que los codos queden alineados con el eje de la m\xE1quina.","Apoya los brazos en la almohadilla y agarra las asas.","Mant\xE9n los brazos pegados a la almohadilla.","Empuja las asas hacia abajo hasta estirar los brazos.","Deja que las asas suban despacio hasta flexionar los codos del todo."]},{id:"WcHl7ru",name:"Press de banca con agarre cerrado en multipower",nameEn:"Smith Close-grip Bench Press",primary:"triceps",secondary:[],equipment:"Machine",difficulty:"Beginner",art:"smith-close-grip-bench-press",steps:["Ajusta la altura del asiento y col\xF3cate en el banco con los pies apoyados en el suelo.","Agarra la barra cerrado, algo m\xE1s estrecho que la anchura de los hombros.","Baja la barra hacia el pecho, con los codos pegados al cuerpo.","Aguanta un momento abajo y empuja la barra de vuelta a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"TFqbd8t",name:"Crunch en el suelo",nameEn:"Crunch Floor",primary:"abdomen",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"crunch",steps:["T\xFAmbate boca arriba con las rodillas flexionadas y los pies apoyados en el suelo.","Pon las manos detr\xE1s de la cabeza con los codos abiertos.","Aprieta el abdomen y despega los hombros del suelo, enroll\xE1ndote hacia las rodillas.","Aguanta un momento arriba y baja los hombros despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"QOA0FD0",name:"Elevaci\xF3n de piernas colgado",nameEn:"Hanging Leg Raise",primary:"abdomen",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"hanging-leg-raise",steps:["Cu\xE9lgate de la barra en pronaci\xF3n, con los brazos estirados del todo.","Aprieta el core y sube las piernas por delante, manteni\xE9ndolas estiradas.","Sigue subiendo hasta que las piernas queden paralelas al suelo o algo por encima.","Aguanta un momento arriba y baja las piernas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"XVDdcoj",name:"Giro ruso",nameEn:"Russian Twist",primary:"abdomen",secondary:["obliques"],equipment:"Bodyweight",difficulty:"Intermediate",art:"russian-twist",steps:["Si\xE9ntate en el suelo con las rodillas flexionadas y los pies apoyados.","\xC9chate un poco hacia atr\xE1s manteniendo la espalda recta y el core apretado.","Junta las manos delante del pecho, o sujeta un peso si quieres.","Despega los pies del suelo, en equilibrio sobre los isquiones.","Gira el tronco a la derecha, llevando las manos o el peso hacia ese lado."]},{id:"MvQPqVW",name:"Le\xF1ador en polea",nameEn:"Cable Woodchop",primary:"abdomen",secondary:["obliques"],equipment:"Cable",difficulty:"Beginner",art:"cable-woodchop",steps:["Pon la polea alta y col\xF3cate de lado a ella con los pies separados.","Agarra el asa con las dos manos por encima del hombro m\xE1s cercano a la torre.","Mant\xE9n los brazos largos y el abdomen firme.","Tira del asa hacia abajo cruzando el cuerpo hasta la rodilla contraria, girando la cadera y el pie de atr\xE1s.","Devuelve el asa despacio arriba y cambia de lado al acabar la serie."]},{id:"CqhoytW",name:"Hip thrust en multipower",nameEn:"Smith Hip Thrust",primary:"abdomen",secondary:["glutes","hamstrings"],equipment:"Machine",difficulty:"Beginner",art:"smith-machine-hip-thrust",steps:["Si\xE9ntate en el suelo con la parte alta de la espalda apoyada en un banco dentro del multipower.","Coloca la barra sobre la cadera con una almohadilla debajo.","Apoya los pies en el suelo a la anchura de la cadera.","Empuja con los talones para subir la cadera hasta alinear rodillas y hombros.","Aprieta los gl\xFAteos arriba y baja la cadera despacio."]},{id:"WW95auq",name:"Crunch de rodillas en polea",nameEn:"Cable Kneeling Crunch",primary:"abdomen",secondary:["obliques"],equipment:"Cable",difficulty:"Beginner",art:"cable-crunch",steps:["Engancha una cuerda a la polea alta y ponte de rodillas de espaldas a la m\xE1quina.","Sujeta la cuerda con las dos manos y col\xF3cala detr\xE1s de la cabeza, con los codos abiertos.","Con la cadera quieta, flexiona el tronco llev\xE1ndolo hacia los muslos.","Aguanta un momento abajo y vuelve despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"RqOtqD7",name:"Crunch inverso",nameEn:"Reverse Crunch",primary:"abdomen",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"reverse-crunch",steps:["T\xFAmbate boca arriba con los brazos a los lados y las rodillas flexionadas.","Levanta los pies del suelo hasta que los muslos queden verticales.","Despega la cadera del suelo llevando las rodillas hacia el pecho.","Aguanta arriba apretando el abdomen.","Baja la cadera despacio hasta el suelo."]},{id:"qaZVsGk",name:"Toque de talones alterno",nameEn:"Alternate Heel Touches",primary:"abdomen",secondary:["obliques"],equipment:"Bodyweight",difficulty:"Intermediate",art:"heel-tap",steps:["T\xFAmbate boca arriba con las rodillas flexionadas y los pies apoyados en el suelo.","Estira los brazos a los lados, paralelos al suelo.","Aprieta el abdomen, despega los hombros del suelo y lleva la mano derecha hacia el tal\xF3n derecho.","Vuelve a la posici\xF3n inicial y repite hacia la izquierda, llevando la mano izquierda al tal\xF3n izquierdo.","Sigue alternando lados durante las repeticiones que quieras."]},{id:"uWpxD4v",name:"Elevaci\xF3n de rodillas colgado",nameEn:"Hanging Knee Raise",primary:"abdomen",secondary:[],equipment:"Bodyweight",difficulty:"Intermediate",art:"hanging-knee-raise",steps:["Cu\xE9lgate de la barra con los brazos estirados del todo y las rodillas a 90 grados.","Aprieta el core y sube las rodillas hacia el pecho, acerc\xE1ndolas todo lo posible a los codos.","Baja las piernas despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras."]},{id:"8urJS9b",name:"Hiperextensiones en banco",nameEn:"Back Extension",primary:"lowerback",secondary:["glutes","hamstrings"],equipment:"Machine",difficulty:"Beginner",art:"back-extension",steps:["Ajusta el banco de hiperextensiones para que el apoyo quede justo por debajo de la cadera.","Engancha los tobillos bajo los rodillos y cruza los brazos sobre el pecho.","Baja el tronco despacio flexionando la cadera.","Sube el tronco hasta que el cuerpo forme una l\xEDnea recta.","Aprieta los gl\xFAteos arriba sin arquear la zona lumbar."]},{id:"superman",name:"Superman en el suelo",nameEn:"Superman",primary:"lowerback",secondary:["glutes","hamstrings"],equipment:"Bodyweight",difficulty:"Beginner",art:"superman",steps:["T\xFAmbate boca abajo con los brazos estirados por delante.","Mant\xE9n el cuello en l\xEDnea con la espalda.","Despega a la vez brazos, pecho y piernas del suelo.","Aprieta los gl\xFAteos y la zona lumbar arriba.","Baja todo despacio y repite."]},{id:"superman-hold",name:"Superman isom\xE9trico",nameEn:"Superman Hold",primary:"lowerback",secondary:["glutes","hamstrings"],equipment:"Bodyweight",difficulty:"Beginner",art:"superman-hold",steps:["T\xFAmbate boca abajo con los brazos estirados hacia delante.","Despega brazos, pecho y piernas del suelo.","Aguanta esa posici\xF3n respirando con normalidad.","Mira hacia el suelo para mantener el cuello neutro.","Baja cuando ya no puedas sostener la postura."]},{id:"IpONWYv",name:"Flexi\xF3n lateral con mancuerna",nameEn:"Dumbbell Side Bend",primary:"obliques",secondary:["abdomen"],equipment:"Dumbbell",difficulty:"Intermediate",art:"dumbbell-side-bend",steps:["Ponte de pie con los pies a la anchura de los hombros y una mancuerna en una mano, colgando al costado.","Con la espalda recta y el core apretado, incl\xEDnate despacio hacia el lado contrario a la mancuerna, bajando el peso hasta donde llegues c\xF3modo.","Aguanta un momento y vuelve despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de lado."]},{id:"side-plank-hip-dip",name:"Plancha lateral con ca\xEDda de cadera",nameEn:"Side Plank Hip Dip",primary:"obliques",secondary:["shoulders","glutes"],equipment:"Bodyweight",difficulty:"Intermediate",art:"side-plank-hip-dip",steps:["Ponte en plancha lateral sobre el antebrazo con los pies apilados.","Coloca el codo justo debajo del hombro.","Baja la cadera hacia el suelo sin llegar a tocarlo.","Sube la cadera hasta dejar el cuerpo recto otra vez.","Termina las repeticiones de un lado antes de cambiar."]},{id:"banded-woodchop",name:"Le\xF1ador con banda",nameEn:"Banded Woodchop",primary:"obliques",secondary:["shoulders","glutes"],equipment:"Band",difficulty:"Intermediate",art:"banded-woodchop",steps:["Fija una banda en alto y col\xF3cate de lado con los pies separados.","Sujeta la banda con las dos manos por encima del hombro m\xE1s alejado.","Tira en diagonal hacia la cadera contraria.","Gira el tronco y deja que el pie de atr\xE1s pivote.","Vuelve por el mismo camino con control."]},{id:"VO2qeJg",name:"Aducci\xF3n de cadera en plancha lateral",nameEn:"Side Plank Hip Adduction",primary:"obliques",secondary:["quads"],equipment:"Bodyweight",difficulty:"Intermediate",art:"copenhagen-plank",steps:["T\xFAmbate de lado junto a un banco, apoyado en el antebrazo con el codo justo debajo del hombro.","Apoya la cara interna de la pierna de arriba en el banco, a la altura de la rodilla para hacerlo m\xE1s f\xE1cil o del tobillo para hacerlo m\xE1s dif\xEDcil, con la pierna de abajo en el suelo, debajo.","Aprieta el core y sube la cadera hasta que el cuerpo quede en l\xEDnea recta de la cabeza a los pies.","Empuja la pierna de arriba contra el banco y sube la de abajo hasta tocar la parte de abajo del banco.","Baja la pierna de abajo hacia el suelo con control, sin dejar caer la cadera, y cambia de lado al acabar la serie."]},{id:"side-plank-hold",name:"Plancha lateral",nameEn:"Side Plank",primary:"obliques",secondary:["abdomen","shoulders"],equipment:"Bodyweight",difficulty:"Beginner",art:"side-plank",steps:["T\xFAmbate de lado con el codo bajo el hombro y las piernas juntas.","Sube la cadera hasta que el cuerpo quede en l\xEDnea recta.","Mant\xE9n la cadera de arriba encima de la de abajo, sin girarte hacia delante.","Aguanta respirando con calma y cambia de lado."]},{id:"cross-body-crunch",name:"Crunch cruzado",nameEn:"Cross-Body Crunch",primary:"obliques",secondary:["abdomen"],equipment:"Bodyweight",difficulty:"Beginner",art:"cross-body-crunch",steps:["T\xFAmbate boca arriba con las rodillas flexionadas y los pies en el suelo.","Coloca las manos suavemente a los lados de la cabeza.","Sube y gira para acercar un codo a la rodilla contraria.","Aprieta el abdomen cuando se junten el codo y la rodilla.","Baja otra vez y repite hacia el otro lado."]},{id:"6bOA1Oi",name:"Flexi\xF3n lateral con lastre en fitball",nameEn:"Weighted Side Bend (On Stability Ball)",primary:"obliques",secondary:["abdomen"],equipment:"Weighted",difficulty:"Intermediate",art:"ball-side-bend",steps:["Si\xE9ntate en un fitball con los pies a la anchura de los hombros y apoyados en el suelo.","Sujeta un peso en una mano y pon la otra en la cadera.","Aprieta el core e incl\xEDnate despacio hacia el lado del peso, con la espalda recta.","Aguanta un momento abajo y vuelve despacio a la posici\xF3n inicial.","Repite las repeticiones que quieras y cambia de lado."]},{id:"kettlebell-russian-twist",name:"Giro ruso con kettlebell",nameEn:"Kettlebell Russian Twist",primary:"obliques",secondary:["abdomen"],equipment:"Kettlebell",difficulty:"Intermediate",art:"weighted-russian-twist",steps:["Si\xE9ntate en el suelo con las rodillas dobladas y los talones apenas apoyados.","Sujeta la kettlebell por los cuernos delante del pecho.","\xC9chate un poco hacia atr\xE1s y saca pecho.","Gira el torso para llevar la pesa junto a una cadera y luego a la otra.","El giro sale de las costillas, no solo de los brazos."]},{id:"kettlebell-side-bend",name:"Flexi\xF3n lateral con kettlebell",nameEn:"Kettlebell Side Bend",primary:"obliques",secondary:[],equipment:"Kettlebell",difficulty:"Beginner",art:"dumbbell-side-bend",steps:["De pie y erguido, con una kettlebell colgando de una mano.","Pon la mano libre detr\xE1s de la cabeza y mant\xE9n la cadera fija.","Incl\xEDnate hacia el lado cargado dejando que la pesa baje por la pierna.","Sube tirando con el costado contrario.","Acaba la serie y cambia de mano."]},{id:"dead-hang-hold",name:"Colgarse de la barra",nameEn:"Dead Hang",primary:"forearm",secondary:["back","shoulders"],equipment:"Bodyweight",difficulty:"Beginner",art:"dead-hang",steps:["Agarra la barra de dominadas en prono, con las manos al ancho de los hombros.","Levanta los pies y cu\xE9lgate con los brazos estirados.","Deja que los hombros se estiren manteniendo el abdomen algo firme.","Aguanta el tiempo que hayas puesto y baja con control."]},{id:"wrist-prep",name:"Preparaci\xF3n de mu\xF1ecas",nameEn:"Wrist Prep",primary:"forearm",secondary:[],equipment:"Bodyweight",difficulty:"Beginner",art:"cat-cow-stretch",steps:["Ponte de rodillas con las palmas apoyadas en el suelo y los dedos hacia delante.","Balancea el peso adelante y atr\xE1s con suavida
